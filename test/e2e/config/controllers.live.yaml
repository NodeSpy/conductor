# The live-provider conductor config (docker-compose.live.yml): real backends,
# opt-in, not part of the hermetic CI run.
#
# Migrated from the legacy `integrations:` + `agents:` schema by
# `conductor config migrate`; agent behavior moved onto the steps, with `name:`
# pinning each old profile's identity.
connectors:
  github:
    use: github
    app:
      app_id: 123456
      private_key_path: /etc/conductor/github-app.pem
      verify_signature: false
      webhook_secret: e2e-webhook-secret
    identity:
      commit_author: self
      read_token: app
      write_token: e2e-user-write-token
    me:
      logins:
        - conductor-user
    policy:
      reply_to_bots: decline_only
    webhook:
      listen: 0.0.0.0:8788
runtimes:
  acp_gemini:
    use: acp
    agent: gemini
    session_model: resumable
    command:
      - gemini
      - --acp
      - -m
      - gemini-flash-lite-latest
  acp_omp:
    use: acp
    agent: omp
    session_model: resumable
    command:
      - omp
      - acp
  cli_claude:
    use: acp
    agent: claude-code
    transport: cli
    command:
      - claude
      - -p
      - --dangerously-skip-permissions
      - --output-format
      - json
  cli_codex:
    use: acp
    agent: codex
    transport: cli
    command:
      - codex
      - exec
      - --dangerously-bypass-approvals-and-sandbox
      - --skip-git-repo-check
  deck:
    use: agent-deck
  paseo:
    use: paseo
    bin: /usr/local/bin/fakepaseo
triggers:
  - "on": github.merge_conflict
    filter:
      repo:
        - grpb/cliclaude
    steps:
      - type: agent
        prompt: 'You are in a git worktree for {{.repo}} PR #{{.pr}} (the current directory). Make a minimal edit to a file, then run `git add -A`, `git commit -m "resolve {{.repo}}#{{.pr}}"`, and `git push origin HEAD`. You have push access to origin. Do this now, non-interactively.'
        name: fx_claude
        workspace: worktree
        wait_timeout: 10m
        archive_when_done: true
        runtime: cli_claude
  - "on": github.merge_conflict
    filter:
      repo:
        - grpb/clicodex
    steps:
      - type: agent
        prompt: 'You are in a git worktree for {{.repo}} PR #{{.pr}} (the current directory). Make a minimal edit to a file, then run `git add -A`, `git commit -m "resolve {{.repo}}#{{.pr}}"`, and `git push origin HEAD`. You have push access to origin. Do this now, non-interactively.'
        name: fx_codex
        workspace: worktree
        wait_timeout: 10m
        archive_when_done: true
        runtime: cli_codex
  - "on": github.merge_conflict
    filter:
      repo:
        - grpb/acpgemini
    steps:
      - type: agent
        prompt: 'You are in a git worktree for {{.repo}} PR #{{.pr}} (the current directory). Make a minimal edit to a file, then run `git add -A`, `git commit -m "resolve {{.repo}}#{{.pr}}"`, and `git push origin HEAD`. You have push access to origin. Do this now, non-interactively.'
        name: fx_gemini
        workspace: worktree
        wait_timeout: 10m
        archive_when_done: true
        runtime: acp_gemini
  - "on": github.merge_conflict
    filter:
      repo:
        - grpb/ocnative
    steps:
      - type: agent
        prompt: 'You are in a git worktree for {{.repo}} PR #{{.pr}} (the current directory). Make a minimal edit to a file, then run `git add -A`, `git commit -m "resolve {{.repo}}#{{.pr}}"`, and `git push origin HEAD`. You have push access to origin. Do this now, non-interactively.'
        name: fx_omp
        workspace: worktree
        wait_timeout: 10m
        archive_when_done: true
        runtime: acp_omp
  - "on": github.merge_conflict
    filter:
      repo:
        - grpb/deck
    steps:
      - type: agent
        prompt: 'You are in a git worktree for {{.repo}} PR #{{.pr}} (the current directory). Make a minimal edit to a file, then run `git add -A`, `git commit -m "resolve {{.repo}}#{{.pr}}"`, and `git push origin HEAD`. You have push access to origin. Do this now, non-interactively.'
        name: fx_deck
        workspace: worktree
        wait_timeout: 10m
        archive_when_done: true
        runtime: deck
policy:
  concurrency:
    max_agents: 4
store:
  state_file: /data/state.json
  audit_log: /data/audit.jsonl
