# The controller-matrix conductor: an explicit `runtimes:` block per backend, so
# group A/C/E can assert which one a dispatch resolved to.
#
# Migrated from the legacy `integrations:` + `agents:` schema by
# `conductor config migrate`; agent behavior moved onto the steps, with `name:`
# pinning each old profile's identity.
x-migrated:
  fx_acp_gemini: &fx_acp_gemini
    name: fx_acp_gemini
    type: agent
    workspace: worktree
    archive_when_done: true
    runtime: acp_gemini
  fx_cli_claude: &fx_cli_claude
    name: fx_cli_claude
    type: agent
    workspace: worktree
    archive_when_done: true
    runtime: cli_claude
connectors:
  default:
    use: web
    base_url: http://localhost:8099
    listen: 0.0.0.0:8099
  github:
    use: github
    app:
      app_id: 123456
      private_key_path: /etc/conductor/github-app.pem
      verify_signature: false
      webhook_secret: e2e-webhook-secret
    identity:
      commit_author: self
      read_token: app
      write_token: e2e-user-write-token
    me:
      logins:
        - conductor-user
    policy:
      reply_to_bots: decline_only
    webhook:
      listen: 0.0.0.0:8788
runtimes:
  acp_codex:
    use: acp
    agent: codex
    transport: acp
    session_model: resumable
    command:
      - fakeacp
  acp_gemini:
    use: acp
    agent: gemini
    session_model: resumable
    command:
      - fakeacp
  cli_claude:
    use: acp
    agent: claude-code
    transport: cli
  cli_codex:
    use: acp
    agent: codex
    transport: cli
  deck:
    use: agent-deck
  deflt:
    use: paseo
    default: true
  oc_acp:
    use: acp
    agent: opencode
    transport: acp
    session_model: resumable
    command:
      - fakeacp
  oc_native:
    use: opencode
  pae:
    use: paseo
    bin: /usr/local/bin/fakepaseo
  stub:
    use: acp
    agent: gemini
triggers:
  - "on": github.merge_conflict
    filters:
      exclude_repos:
        - grpc/*
        - grpf/*
        - grpj/*
      repos:
        - a2/*
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (explicit controller).
        name: fixer_explicit
        workspace: worktree
        archive_when_done: true
        runtime: pae
  - "on": github.merge_conflict
    filters:
      exclude_repos:
        - a2/*
        - grpc/*
        - grpf/*
        - grpj/*
      repos:
        - a3/*
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (default controller).
        name: fixer_default
        workspace: worktree
        archive_when_done: true
  - "on": github.merge_conflict
    filters:
      exclude_repos:
        - a2/*
        - a3/*
        - grpc/*
        - grpf/*
        - grpj/*
      repos:
        - a4/*
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (non-runnable controller).
        name: fixer_stub
        workspace: worktree
        runtime: stub
  - "on": github.merge_conflict
    filters:
      repos:
        - grpb/cliclaude
    steps:
      - !!merge <<: *fx_cli_claude
        type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (cli:claude-code).
  - "on": github.merge_conflict
    filters:
      repos:
        - grpb/clicodex
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (cli:codex).
        name: fx_cli_codex
        workspace: worktree
        archive_when_done: true
        runtime: cli_codex
  - "on": github.merge_conflict
    filters:
      repos:
        - grpb/acpgemini
    steps:
      - !!merge <<: *fx_acp_gemini
        type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (acp:gemini).
  - "on": github.merge_conflict
    filters:
      repos:
        - grpb/acpcodex
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (acp:codex-adapter).
        name: fx_acp_codex
        workspace: worktree
        archive_when_done: true
        runtime: acp_codex
  - "on": github.merge_conflict
    filters:
      repos:
        - grpb/ocacp
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (opencode-acp).
        name: fx_oc_acp
        workspace: worktree
        archive_when_done: true
        runtime: oc_acp
  - "on": github.merge_conflict
    filters:
      repos:
        - grpb/ocnative
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (opencode-native).
        name: fx_oc_native
        workspace: worktree
        archive_when_done: true
        runtime: oc_native
  - "on": github.merge_conflict
    filters:
      repos:
        - grpb/deck
    steps:
      - type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (agent-deck).
        name: fx_deck
        workspace: worktree
        archive_when_done: true
        runtime: deck
  - "on": github.review_requested
    filters:
      repos:
        - grpc/*
    steps:
      - !!merge <<: *fx_acp_gemini
        id: review
        type: agent
        prompt: Draft a review of {{.repo}}#{{.pr}} and wait for approve/revise/discard.
        background: true
        handoff: default
  - "on": github.review_requested
    filters:
      exclude_repos:
        - grpc/*
      repos:
        - grpf/*
    steps:
      - !!merge <<: *fx_cli_claude
        id: review
        type: agent
        prompt: Draft a review of {{.repo}}#{{.pr}} and wait for approve/revise/discard.
        background: true
        handoff: default
  - "on": github.merge_conflict
    filters:
      exclude_repos:
        - grpc/*
        - grpf/*
      repos:
        - grpj/*
    steps:
      - !!merge <<: *fx_acp_gemini
        type: agent
        prompt: Resolve {{.repo}}#{{.pr}} (acp crash).
        env:
          FAKE_ACP_CRASH: "1"
policy:
  concurrency:
    max_agents: 8
store:
  state_file: /data/state.json
  audit_log: /data/audit.jsonl
