# Main hermetic conductor config. Points at the mock GitHub API and the
# sink-catcher; commits/pushes go to the local git:// forge. No secrets, no LLM.
#
# Group A1 (backward compat) asserts that a step naming NO runtime resolves to
# paseo: the `runtimes:` block below declares paseo only so the fake binary can
# be pointed at, and no step names it.
#
# Migrated from the legacy `integrations:` + `agents:` schema by
# `conductor config migrate`. Agent behavior now lives ON the steps: profiles
# used by more than one step are parked under `x-migrated:` and pulled in with
# `<<:`, and the `name:` each one carries pins the identity the old profile
# name had, so memory/session/outcome history keeps matching.
#
# NOTE: the legacy `paseo_bin:` top-level key is deliberately NOT kept. A
# legacy key alongside connectors:/triggers: makes the file MIXED, and the
# boot-time migration escalates rather than transforming it — which is how
# this fixture failed A1 during the port.
x-migrated:
  fixer: &fixer
    name: fixer
    type: agent
    workspace: worktree
    wait_timeout: 5m
    archive_when_done: true # archived inline the moment the step finishes (group B)
  interactive: &interactive
    name: interactive
    type: agent
    workspace: worktree
    wait_timeout: 5m
connectors:
  default:
    use: web
    base_url: http://localhost:8099
    listen: 0.0.0.0:8099
  github:
    use: /usr/local/bin/conductor-github
    api_base: http://mock-github:8080
    app:
      app_id: 123456
      private_key_path: /etc/conductor/github-app.pem
    identity:
      commit_author: self
      read_token: app
      write_token: e2e-user-write-token
    me:
      logins:
        - conductor-user
    policy:
      reply_to_bots: decline_only
    webhook:
      listen: 0.0.0.0:8787
      path: /webhook
      secret: e2e-webhook-secret
      verify_signature: true
  notify-discord:
    use: /usr/local/bin/conductor-discord
    webhook_url: http://sink-catcher:8080/discord
  notify-notifiarr:
    use: /usr/local/bin/conductor-notifiarr
    api_base: http://sink-catcher:8080/notifiarr/api/v1
    api_key: e2e-notifiarr-key
    channel_id: "42"
  notify-ntfy:
    use: /usr/local/bin/conductor-ntfy
    server: http://sink-catcher:8080/ntfy
    topic: conductor
  notify-pushover:
    use: /usr/local/bin/conductor-pushover
    api_base: http://sink-catcher:8080/pushover
    token: e2e-pushover-token
    user: e2e-pushover-user
  notify-slack:
    use: /usr/local/bin/conductor-slack
    api_base: http://sink-catcher:8080/slackapi
    webhook_url: http://sink-catcher:8080/slack
runtimes:
  paseo:
    use: paseo
    bin: /usr/local/bin/fakepaseo
triggers:
  - "on": github.changes_requested
    filter:
      repo:
        - acme/*
        - grpe/*
    steps:
      - !!merge <<: *fixer
        type: agent
        prompt: Address the requested changes on {{.repo}}#{{.pr}}, commit and push.
  - "on": github.failing_checks
    filter:
      repo:
        - acme/*
        - grpe/*
    options:
      ignore_checks:
        - title-validation
    steps:
      - !!merge <<: *fixer
        type: agent
        prompt: Fix the failing checks on {{.repo}}#{{.pr}}, commit and push.
  - "on": github.merge_conflict
    filter:
      repo:
        - acme/*
        - grpe/*
    steps:
      - !!merge <<: *fixer
        type: agent
        prompt: Resolve the merge conflict on {{.repo}}#{{.pr}} against {{.base}}, commit and push.
  - "on": github.new_comment
    filter:
      repo:
        - acme/*
        - grpe/*
    # Progress as plain hooks (the pr-autopilot pack's shape): 👀 + pending on
    # the commit the run starts on; 🚀/👍 + success on that same commit; 😕 +
    # failure on the PR's current head; on a stop (PR closed mid-run) the 👀
    # comes off and the pending resolves. Group H4 asserts what they post.
    hooks:
      - { at: start, if: reaction_subjects, uses: github.react,
          options: { repo: "{{.repo}}", pr: "{{.pr}}", subjects: "{{.reaction_subjects}}", content: eyes } }
      - { at: start, uses: github.set_status,
          options: { repo: "{{.repo}}", sha: "{{.run.start_sha}}", state: pending, context: "{{.me.login}} / comment", description: "replying to {{.author}}'s comment" } }
      - { at: done, if: reaction_subjects, uses: github.react,
          options: { repo: "{{.repo}}", pr: "{{.pr}}", subjects: "{{.reaction_subjects}}", content: "{{if .run.pushed}}rocket{{else}}+1{{end}}" } }
      - { at: done, uses: github.set_status,
          options: { repo: "{{.repo}}", sha: "{{.run.start_sha}}", state: success, context: "{{.me.login}} / comment", description: "{{if .run.pushed}}pushed {{.run.head_short}}{{else}}done — no changes pushed{{end}}" } }
      - { at: fail, if: reaction_subjects, uses: github.react,
          options: { repo: "{{.repo}}", pr: "{{.pr}}", subjects: "{{.reaction_subjects}}", content: confused } }
      - { at: fail, uses: github.set_status,
          options: { repo: "{{.repo}}", pr: "{{.pr}}", state: failure, context: "{{.me.login}} / comment", description: "gave up: {{.run.reason}}" } }
      - { at: stop, if: reaction_subjects, uses: github.react,
          options: { repo: "{{.repo}}", pr: "{{.pr}}", subjects: "{{.reaction_subjects}}", content: eyes, remove: true } }
      - { at: stop, uses: github.set_status,
          options: { repo: "{{.repo}}", sha: "{{.run.start_sha}}", state: success, context: "{{.me.login}} / comment", description: "stopped — {{.run.reason}}" } }
    steps:
      - !!merge <<: *fixer
        type: agent
        prompt: Address the new comment on {{.repo}}#{{.pr}}, commit and push.
  - "on": github.review_requested
    filter:
      repo:
        - acme/*
        - grpe/*
    steps:
      - !!merge <<: *interactive
        id: review
        type: agent
        prompt: Draft a review of {{.repo}}#{{.pr}} and wait for the human's approve/revise/discard.
        background: true
        handoff: default
  - "on": github.changes_requested
    filter:
      not_repo:
        - acme/*
        - grpe/*
      repo:
        - grpd/*
    steps:
      - !!merge <<: *fixer
        type: agent
        prompt: Address the requested changes on {{.repo}}#{{.pr}}, commit and push.
  - "on": github.failing_checks
    filter:
      not_repo:
        - acme/*
        - grpe/*
      repo:
        - grpd/*
    options:
      ignore_checks:
        - title-validation
    steps:
      - !!merge <<: *fixer
        type: agent
        prompt: Fix the failing checks on {{.repo}}#{{.pr}}, commit and push.
  - "on": github.merge_conflict
    filter:
      not_repo:
        - acme/*
        - grpe/*
      repo:
        - grpd/*
    steps:
      - !!merge <<: *fixer
        type: agent
        prompt: Resolve the merge conflict on {{.repo}}#{{.pr}} against {{.base}}, commit and push.
  - "on": github.new_comment
    filter:
      not_repo:
        - acme/*
        - grpe/*
      repo:
        - grpd/*
    steps:
      - type: agent
        prompt: Address the new comment on {{.repo}}#{{.pr}}, commit and push.
        name: fixer_live
        workspace: worktree
        wait_timeout: 5m
        archive_when_done: false
  - "on": github.review_requested
    filter:
      not_repo:
        - acme/*
        - grpe/*
      repo:
        - grpd/*
    steps:
      - !!merge <<: *interactive
        id: review
        type: agent
        prompt: Draft a review of {{.repo}}#{{.pr}} and wait for the human's approve/revise/discard.
        background: true
        handoff: default
  - "on": conductor.dispatch
    name: notify-dispatch
    steps:
      - uses: notify-slack.post
        options:
          text: conductor {{.message}}
      - uses: notify-discord.post
        options:
          text: conductor {{.message}}
      - uses: notify-ntfy.publish
        options:
          message: '{{.message}}'
          title: conductor
      - uses: notify-pushover.notify
        options:
          message: conductor {{.message}}
      - uses: notify-notifiarr.notify
        options:
          text: '{{.message}}'
  - "on": conductor.escalate
    name: notify-escalate
    steps:
      - uses: notify-slack.post
        options:
          text: conductor {{.message}}
      - uses: notify-discord.post
        options:
          text: conductor {{.message}}
      - uses: notify-ntfy.publish
        options:
          message: '{{.message}}'
          title: conductor
      - uses: notify-pushover.notify
        options:
          message: conductor {{.message}}
      - uses: notify-notifiarr.notify
        options:
          text: '{{.message}}'
  - "on": conductor.failed
    name: notify-failed
    steps:
      - uses: notify-slack.post
        options:
          text: conductor {{.message}}
      - uses: notify-discord.post
        options:
          text: conductor {{.message}}
      - uses: notify-ntfy.publish
        options:
          message: '{{.message}}'
          title: conductor
      - uses: notify-pushover.notify
        options:
          message: conductor {{.message}}
      - uses: notify-notifiarr.notify
        options:
          text: '{{.message}}'
  - "on": conductor.needs_input
    name: notify-needs_input
    steps:
      - uses: notify-slack.post
        options:
          text: conductor {{.message}}
      - uses: notify-discord.post
        options:
          text: conductor {{.message}}
      - uses: notify-ntfy.publish
        options:
          message: '{{.message}}'
          title: conductor
      - uses: notify-pushover.notify
        options:
          message: conductor {{.message}}
      - uses: notify-notifiarr.notify
        options:
          text: '{{.message}}'
policy:
  concurrency:
    max_agents: 3
store:
  state_file: /data/state.json
  audit_log: /data/audit.jsonl
