# Group A5: two controllers flagged default:true → validation error.
integrations:
  - type: github
    name: github
    enabled: true
    app: { app_id: 1, private_key_path: /etc/conductor/github-app.pem }
    webhook: { listen: "0.0.0.0:8790", secret: s, verify_signature: false }
    defaults: { me: { logins: [conductor-user] } }
    rules: [ { match: { repos: ["acme/*"] } } ]
# Validates the controllers: block itself — there is no top-level steps:
# section to reference it from (a step lives in the trigger that runs it).
controllers:
  one: { type: paseo, default: true }
  two: { type: paseo, default: true }
store: { state_file: /data/state.json, audit_log: /data/audit.jsonl }
paseo_bin: /usr/local/bin/fakepaseo
