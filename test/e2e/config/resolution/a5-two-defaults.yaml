# Group A5: two runtimes flagged default:true → validation error.
connectors:
  timer: { use: cron, schedules: { tick: { every: 1h } } }
runtimes:
  one: { use: paseo, bin: /usr/local/bin/fakepaseo, default: true }
  two: { use: paseo, bin: /usr/local/bin/fakepaseo, default: true }
triggers:
  - on: timer.tick
    steps: [{ id: t, type: command, command: ["true"] }]
store: { state_file: /data/state.json, audit_log: /data/audit.jsonl }
