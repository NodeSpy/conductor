# Group A5: unknown transport → validation error.
connectors:
  timer: { use: cron, schedules: { tick: { every: 1h } } }
runtimes:
  bad: { use: acp, agent: gemini, transport: carrier-pigeon }
triggers:
  - on: timer.tick
    steps: [{ id: t, type: command, command: ["true"] }]
store: { state_file: /data/state.json, audit_log: /data/audit.jsonl }
