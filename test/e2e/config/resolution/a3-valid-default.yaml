# Group A3: a single default:true runtime is accepted by validation.
connectors:
  timer: { use: cron, schedules: { tick: { every: 1h } } }
runtimes:
  deflt: { use: paseo, bin: /usr/local/bin/fakepaseo, default: true }
triggers:
  - on: timer.tick
    steps: [{ id: t, type: command, command: ["true"] }]
store: { state_file: /data/state.json, audit_log: /data/audit.jsonl }
