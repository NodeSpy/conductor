# Connectors-model config for the e2e stack (group K): a github connector
# receiving signed fixture webhooks, a slack connector whose Web API base is
# the sink-catcher (PC_SLACK_API_URL), an SSH host looping back to this
# container's own sshd, and triggers exercising cross-boundary steps, hooks,
# code steps, grouping, and remote execution. Hermetic — no egress.

connectors:
  gh:
    use: github
    app:
      app_id: 123456
      private_key_path: /etc/conductor/github-app.pem
    webhook:
      listen: "0.0.0.0:8787"
      path: /webhook
      secret: e2e-webhook-secret
      verify_signature: true
    sweep: { enabled: false }
    me: { logins: [conductor-user] }
    identity:
      read_token: app
      write_token: e2e-user-write-token # literal token; no gh binary in the image

  slack:
    use: slack
    # Verbs only (no slack triggers), so no Socket Mode connection is opened;
    # bot_token is all the verb face needs. The API base comes from
    # PC_SLACK_API_URL (the sink-catcher's slack-shaped endpoint).
    bot_token: xoxb-e2e-dummy
    options: { channel: CDEFAULT }

  # K7: an ask-capable web connector — its draft pages serve on :8095 inside
  # this container; the harness drives approve/revise/discard over HTTP.
  page:
    use: web
    base_url: "http://localhost:8095"
    listen: ":8095"
    ttl: 5m

hosts:
  selfbox:
    host: 127.0.0.1 # this container's own sshd (started by entrypoint-conn.sh)
    user: root
    key: /root/.ssh/id_ed25519
    known_hosts: /root/.ssh/known_hosts
    # A remote paseo runtime gets its runtime env from the host entry — ssh
    # carries no local process env across.
    env:
      FORGE_BASE: "git://forge/"
      FAKE_PASEO_STATE: /data/fakepaseo
      PC_GITHUB_API_BASE: "http://mock-github:8080"

runtimes:
  paseo: { use: paseo, bin: /usr/local/bin/fakepaseo, default: true }
  # K6: a paseo runtime on an SSH host — every paseo CLI call (run/ls/send/
  # archive/clone/workspace) executes on selfbox over ssh.
  gpu: { use: paseo, bin: /usr/local/bin/fakepaseo, host: selfbox }
  # T (output_schema on a CONTROLLER runtime, v0.9.3): a bare-CLI runtime that
  # execs `claude` on PATH (= fakecli). It has no native --output-schema, so the
  # conductor-owned contract must extract + validate the reply conductor-side.
  clijudge: { use: cli, tool: claude-code }

x-templates:
  fixer: &fixer
    type: agent
    name: fixer
    workspace: worktree
    archive_when_done: true
    wait_timeout: 5m
  remotefixer: &remotefixer
    type: agent
    name: remotefixer
    runtime: gpu
    workspace: worktree
    wait_timeout: 5m

triggers:
  # K1: cross-boundary workflow — an agent fixes the conflict while slack
  # hooks announce start and completion.
  - on: gh.merge_conflict
    filter: { repo: ["conn/cweb"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "Resolve the conflict on {{.repo}}#{{.pr}} against {{.base}}: rebase, fix, push."
    hooks:
      - { at: start, uses: slack.post, options: { channel: C1, text: "K1-start {{.repo}}#{{.pr}}" } }
      - { at: done, uses: slack.post, options: { channel: C1, text: "K1-done {{.repo}}#{{.pr}}" } }
      - { at: fail, uses: slack.post, options: { channel: C1, text: "K1-fail {{.error}}" } }

  # K5: remote execution — a host-interpreter code step runs over SSH on
  # selfbox (this container's sshd), its output flowing into a slack post.
  - on: gh.merge_conflict
    name: remote
    filter: { repo: ["conn/cweb"] }
    steps:
      - id: remote
        run: sh
        host: selfbox
        code: |
          printf '{"where":"%s","user":"%s"}' "$(hostname)" "$(id -un)"
      - id: tell
        uses: slack.post
        options: { channel: C5, text: "K5-remote {{.remote.where}} as {{.remote.user}}" }

  # K6: an agent on the REMOTE paseo runtime — the whole dispatch
  # (clone, worktree, run, wait) rides the ssh channel.
  - on: gh.merge_conflict
    name: remote-agent
    filter: { repo: ["conn/rweb"] }
    steps:
      - id: fix
        type: agent
        <<: *remotefixer
        prompt: "Resolve the conflict on {{.repo}}#{{.pr}} against {{.base}}: rebase, fix, push."
    hooks:
      - { at: done, uses: slack.post, options: { channel: C6, text: "K6-done {{.repo}}#{{.pr}}" } }

  # K2: a code step reshapes the comment, a verb posts the result. `use: cli`
  # is the one BUILTIN engine — the scripting engines (js, lua, …) are plugins
  # now and this stack fetches nothing, so the engine-plugin path is proven by
  # group V against the seeded acme-engine instead.
  - on: gh.new_comment
    filter: { repo: ["conn/csvc"] }
    steps:
      - id: shape
        use: cli
        command: [sh]
        env: { BODY: "{{.comment_body}}" }
        code: 'printf %s "{\"msg\": \"seen $BODY\"}"'
      - id: post
        uses: slack.post
        options: { channel: C2, text: "K2 {{.shape.msg}}" }

  # K9: the `cli` ENGINE. `use: cli` runs the step's own argv as a subprocess
  # with the code-step ABI around it — the ctx document as JSON on its stdin,
  # its stdout parsed into the step's outputs. `echoed` proves the input half
  # (it hands ctx straight back), `argv` the output half from a pure argv with
  # no code: at all.
  - on: gh.new_comment
    name: cli-engine
    filter: { repo: ["conn/csvc"] }
    steps:
      - id: echoed
        use: cli
        command: [sh]
        code: "cat"
      - id: argv
        use: cli
        command: [sh, -c, "printf '{\"who\":\"cli-engine\"}'"]
      # K9ctx: the ctx DATA PLANE. The subprocess holds no store — it asks
      # conductor over the per-run socket ($CONDUCTOR_CTX_SOCK, authenticated
      # by $CONDUCTOR_CTX_TOKEN), and conductor authorizes every op host-side.
      # A write round-trips through a real store; the two refusals prove the
      # daemon, not the snippet, is what says no — k9locked is code_access:
      # none, and `nostore` is not defined at all.
      - id: ctxrw
        use: cli
        command: [sh]
        env: { BODY: "{{.comment_body}}" }
        code: |
          H="$CONDUCTOR_CTX_HELPER"
          "$H" ctx sql k9sql exec 'CREATE TABLE IF NOT EXISTS seen (body TEXT)' >/dev/null || exit 1
          "$H" ctx sql k9sql exec 'INSERT INTO seen (body) VALUES (?)' "[\"$BODY\"]" >/dev/null || exit 1
          rows=$("$H" ctx sql k9sql query 'SELECT body FROM seen WHERE body = ?' "[\"$BODY\"]") || exit 1
          "$H" ctx sql k9locked query 'SELECT 1' >/dev/null 2>&1
          locked=$?
          "$H" ctx kv nostore get ns k >/dev/null 2>&1
          nostore=$?
          case "$rows" in
            *"$BODY"*) got=yes ;;
            *) got=no ;;
          esac
          if [ "$got" = yes ] && [ "$locked" != 0 ] && [ "$nostore" != 0 ]; then
            printf '{"ctx":"ok"}'
          else
            printf '{"ctx":"FAIL rows=%s locked=%s nostore=%s"}' "$rows" "$locked" "$nostore"
          fi
      - id: tell
        uses: slack.post
        options: { channel: C9, text: "K9 {{.echoed.comment_body}} via {{.argv.who}}" }
      - id: tellctx
        uses: slack.post
        options: { channel: C9, text: "K9ctx {{.ctxrw.ctx}}" }

  # V: the PLUGIN ENGINE. `use: acme-engine` is a bare, non-builtin engine
  # name, so it resolves to an INSTALLED plugin binary — here the reference
  # engine from test/plugins/acme-engine, recorded in install state by
  # entrypoint-conn.sh (the e2e has no network, so the fetch is the only part
  # skipped; resolution, verify-before-execute and spawn are the real ones).
  # The step is then driven over the plugin wire (plugin.run) instead of by
  # anything compiled into the daemon.
  #
  # Three things have to hold at once for the assertion to pass, and they are
  # the three halves of the code-step ABI over a transport that did not exist
  # before: the rendered ctx reaches the subprocess as `inputs`, its
  # `outputs` come back as the step's outputs, and its ctx data-plane calls
  # are answered by CONDUCTOR over the host.* callbacks — authorized
  # host-side, exactly as the K9ctx socket calls are. `deny_sql` names
  # k9locked (code_access: none), so `denied` can only be true if the DAEMON
  # said no; the engine holds no store and cannot decide anything.
  - on: gh.new_comment
    name: plugin-engine
    filter: { repo: ["conn/cengine"] }
    steps:
      - id: eng
        use: acme-engine
        code: "# the body crosses the wire verbatim"
        args: [alpha, beta]
        env:
          SQL_STORE: k9sql
          SQL_TABLE: engine_kv
          KEY: "{{.repo}}#{{.number}}"
          VALUE: "{{.comment_body}}"
          DENY_SQL: k9locked
          ECHO: comment_body
      - id: tell
        uses: slack.post
        options:
          channel: CV
          text: "V-ENGINE {{.eng.engine}} roundtrip={{.eng.roundtrip}} echo={{.eng.echo}} denied={{.eng.denied}} code_len={{.eng.code_len}}"

  # K7: request-response — web.ask presents a draft page per decision and the
  # workflow reads each answer; a slack post reports all three outcomes.
  - on: gh.new_comment
    filter: { repo: ["conn/cask"] }
    steps:
      - { id: a1, uses: page.ask, options: { prompt: "K7 approve this?", draft: "{{.comment_body}}", timeout: 120s } }
      - { id: a2, uses: page.ask, options: { prompt: "K7 revise this?", draft: "v1", timeout: 120s } }
      - { id: a3, uses: page.ask, options: { prompt: "K7 discard this?", timeout: 120s } }
      - id: tell
        uses: slack.post
        options: { channel: C7, text: "K7 {{.a1.action}}/{{.a2.action}}:{{.a2.text}}/{{.a3.action}}" }

  # K3: grouping — a burst of comments on one PR becomes ONE run.
  - on: gh.new_comment
    name: grouped
    filter: { repo: ["conn/csvc"] }
    group: { key: "{{.repo}}#{{.number}}", window: 2s }
    steps:
      - id: batch
        uses: slack.post
        options: { channel: C3, text: "K3-batch {{.group.count}} last={{.group.last.comment_body}}" }

  # ---------------------------------------------------------------------------
  # Functional groups for #36 §14/§16/§17/§20/§21 (func/* repos). Each trigger
  # drives the REAL engine path and its group in run.sh asserts the feature's
  # observable side-effect (audit rows, forge commits, blob digests, history
  # records, live watch stream), and would go red if the feature were gutted.
  # ---------------------------------------------------------------------------

  # M (§14 cost): the fake agent reports exact token/$ usage in its run JSON
  # (the `[[usage …]]` directive); conductor's meter charges the REPORTED
  # figure (not an estimate) and writes an agent_usage audit row + report spend.
  - on: gh.merge_conflict
    name: cost
    filter: { repo: ["func/cost"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} [[usage in=1234 out=567 cost=0.0421]]"

  # N (§14 budget): a workflow spend cap smaller than one run's cost. The first
  # event runs (charges 0.0421), the second is SHED (0.0421 ≥ 0.03 cap) and its
  # agent step never pushes; after the window frees, a third event runs again.
  - on: gh.merge_conflict
    name: budget
    filter: { repo: ["func/budget1", "func/budget2", "func/budget3"] }
    policy:
      budget: { max_cost_usd: 0.03, window: 8s }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} [[usage in=1234 out=567 cost=0.0421]]"

  # O (§16 gate — PASS): the agent's change is gated by a check that passes, so
  # the downstream promote step fires.
  - on: gh.merge_conflict
    name: gatepass
    filter: { repo: ["func/gatepass"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}}"
        gate: { run: [always-pass], max_revisions: 1 }
      - id: promote
        uses: slack.post
        options: { channel: CGATE, text: "GATEPASS-promoted {{.repo}}" }

  # O (§16 gate — FAIL): the same shape but the gate check always fails. After
  # the bounded revise loop the gate escalates and the step FAILS, so the
  # downstream promote step is suppressed — gutting the gate would let it fire.
  - on: gh.merge_conflict
    name: gatefail
    filter: { repo: ["func/gatefail"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}}"
        gate: { run: [always-fail], max_revisions: 1 }
      - id: promote
        uses: slack.post
        options: { channel: CGATE, text: "GATEFAIL-promoted {{.repo}}" }

  # P (§21 blob): a step stores a known payload as a run-scoped content-addressed
  # blob; a later step reads it back BYTE-IDENTICAL. The slack post carries both
  # the digest (content addressing) and the round-tripped text.
  - on: gh.new_comment
    name: blob
    filter: { repo: ["func/blob"] }
    steps:
      - id: put
        uses: blob.put
        options: { text: "conductor-blob-e2e-payload", name: "payload.txt" }
      - id: read
        uses: blob.read
        options: { blob: "{{.put.blob}}" }
      - id: tell
        uses: slack.post
        options: { channel: CBLOB, text: "BLOB digest={{.put.digest}} text={{.read.text}}" }

  # Q (§20 history): a multi-step workflow so the recorded run shows per-step
  # inputs/outputs; run.sh lists it, inspects it, and retries from a step.
  - on: gh.merge_conflict
    name: hist
    filter: { repo: ["func/hist"] }
    steps:
      - id: prep
        use: cli
        command: [sh, -c, 'printf %s "{\"note\": \"hist-prep\"}"']
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} note={{.prep.note}}"
      - id: tell
        uses: slack.post
        options: { channel: CHIST, text: "HIST-done {{.repo}} note={{.prep.note}}" }

  # R (§17 watch + diff): the agent leaves its edit UNCOMMITTED (`[[dirty]]`) so
  # the run carries a proposed diff. run.sh attaches `conductor watch` before the
  # event and asserts the live event stream AND the diff text in the history JSON.
  - on: gh.merge_conflict
    name: watch
    filter: { repo: ["func/watch"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} [[dirty]]"

  # S (§13 callable): invoked over HTTP by an external orchestrator, not a
  # webhook. `callable: true` opts the trigger into the invoke surface; the
  # n8n-e2e token (below) scopes it. A js step echoes the caller's input (proving
  # inputs flow in under .who / .inputs.who) and a slack post makes the async run
  # observable; the step output surfaces in the structured GET /runs result.
  - on: manual
    name: callable-summary
    callable: true
    steps:
      - id: echo
        use: cli
        command: [sh]
        env: { WHO: "{{.who}}" }
        code: 'printf %s "{\"greeting\": \"hi ${WHO:-nobody}\"}"'
      - id: tell
        uses: slack.post
        options: { channel: CCALL, text: "CALLABLE-done who={{.who}} greeting={{.echo.greeting}}" }

  # S (scope): a second callable workflow the n8n-e2e token does NOT list. Proves
  # deny-by-default scope — invoking it with that token is a uniform 403 and this
  # step must never run.
  - on: manual
    name: callable-scoped
    callable: true
    steps:
      - id: tell
        uses: slack.post
        options: { channel: CCALL, text: "CALLABLE-scoped-LEAKED" }

  # T (output_schema, conductor v0.9.2 — NATIVE): a step whose provider's
  # native --output-schema just works. Rides the same worktree checkout every
  # other fixer-shaped scenario in this file uses — the fake agent's
  # `[[reply {...}]]` marker is its canned structured answer. The slack post
  # reads {{.assess.decision}} straight out of the step's outputs, proving
  # the schema-conforming JSON landed there.
  - on: gh.merge_conflict
    # NOTE (verb-primary): every e2e daemon delivers CLI creds, so this step now
    # exercises the VERB-DIRECTIVE prompt with a plain JSON chat reply landing
    # through the extraction fallback — the native --output-schema probe is
    # deliberately skipped whenever creds exist (one uniform step.done signal).
    # Native remains covered by unit tests for the no-creds path.
    name: schemanative
    filter: { repo: ["func/schemanative"] }
    steps:
      - id: assess
        type: agent
        <<: *fixer
        checkout: none          # read-only triage reads the diff from the prompt — no clone/worktree
        prompt: >-
          assess {{.repo}}#{{.pr}} [[reply {"decision":"approve"}]]
        output_schema:
          type: object
          required: [decision]
          additionalProperties: false
          properties:
            decision: { type: string, enum: [approve, reject] }
      - id: tell
        uses: slack.post
        options: { channel: CSCHEMA, text: "SCHEMA-NATIVE decision={{.assess.decision}}" }

  # T (output_schema — SOFT fallback, the real-contract guard): the step's
  # env pins FAKE_PASEO_NO_NATIVE_SCHEMA=1, so the fake agent answers
  # OUTPUT_SCHEMA_FAILED / "Failed to handle agent.timeline.list_prompts.request"
  # whenever --output-schema is passed — exactly the claude ACP relay failure
  # this feature exists for. Conductor owns the contract: it must catch that,
  # re-run WITHOUT --output-schema (the schema injected into the prompt
  # instead), and still land {{.assess.decision}} for the downstream step. If
  # the AUTO native→soft fallback regresses, this step fails outright (the
  # native attempt always errors for this provider) and no SCHEMA-SOFT post
  # ever appears — there is no other way for this scenario to pass.
  - on: gh.merge_conflict
    name: schemasoft
    filter: { repo: ["func/schemasoft"] }
    steps:
      - id: assess
        type: agent
        <<: *fixer
        checkout: none          # read-only triage reads the diff from the prompt — no clone/worktree
        env: { FAKE_PASEO_NO_NATIVE_SCHEMA: "1" }
        prompt: >-
          assess {{.repo}}#{{.pr}} [[reply {"decision":"approve"}]]
        output_schema:
          type: object
          required: [decision]
          additionalProperties: false
          properties:
            decision: { type: string, enum: [approve, reject] }
      - id: tell
        uses: slack.post
        options: { channel: CSCHEMA, text: "SCHEMA-SOFT decision={{.assess.decision}}" }

  # T (output_schema — VERB-DELIVERED, the done+output contract): the agent
  # holds CLI creds, so its result arrives via `conductor call step.done
  # --json '{"output": …}'` — one atomic final action, validated at the verb
  # boundary. The fake (FAKE_PASEO_VERB_OUTPUT=1) replies useless PROSE and
  # delivers the payload only through the call, so this scenario cannot pass
  # through reply extraction: if the verb path regresses, no SCHEMA-VERB post
  # ever appears.
  - on: gh.merge_conflict
    name: schemaverb
    filter: { repo: ["func/schemaverb"] }
    steps:
      - id: assess
        type: agent
        <<: *fixer
        checkout: none          # read-only triage reads the diff from the prompt — no clone/worktree
        env: { FAKE_PASEO_NO_NATIVE_SCHEMA: "1", FAKE_PASEO_VERB_OUTPUT: "1" }
        prompt: >-
          assess {{.repo}}#{{.pr}} [[reply {"decision":"approve"}]]
        output_schema:
          type: object
          required: [decision]
          additionalProperties: false
          properties:
            decision: { type: string, enum: [approve, reject] }
      - id: tell
        uses: slack.post
        options: { channel: CSCHEMA, text: "SCHEMA-VERB decision={{.assess.decision}}" }

  # T (output_schema on a CONTROLLER runtime, v0.9.3 — "AUTO in all paths"): the
  # assess step runs on the `clijudge` cli runtime (execs `claude` = fakecli),
  # which has NO native --output-schema. Conductor injects the schema directive
  # into the prompt, the agent replies with the object, and the controllerRunner
  # extracts + validates + canonicalizes it into {{.assess.decision}} — the same
  # contract the paseo native/soft paths honor, now on a bare-CLI runtime. If the
  # controller-path enforcement regresses, {{.assess.decision}} is empty and no
  # SCHEMA-CLI post appears.
  - on: gh.merge_conflict
    name: schemacli
    filter: { repo: ["func/schemacli"] }
    steps:
      - id: assess
        type: agent
        name: fixer
        runtime: clijudge
        checkout: none          # read-only triage — no clone/worktree
        wait_timeout: 5m
        prompt: >-
          assess {{.repo}}#{{.pr}} [[reply {"decision":"approve"}]]
        output_schema:
          type: object
          required: [decision]
          additionalProperties: false
          properties:
            decision: { type: string, enum: [approve, reject] }
      - id: tell
        uses: slack.post
        options: { channel: CSCHEMA, text: "SCHEMA-CLI decision={{.assess.decision}}" }

  # U — the unified `filter:` (docs/design/unified-filter.md): the ONE filter
  # key, whose YAML SHAPE is its boolean structure. Phase 2 folded routing in
  # too, so the `repo` scope and the condition are conjuncts of one object —
  # there is no second filter key left to put either in.
  #
  # This is the RosterStream#5590 condition, spelled out: skip a release PR
  # only when it is BOTH release-titled AND on a release branch.
  #
  # The legacy spelling of the same intent —
  #   filters: { exclude: { branches: [staging, prod], title: ['Release '] } }   # retired
  # — is an OR denylist whose `title` arm is a case-insensitive SUBSTRING, so
  # it silently skipped a changelog PR whose title merely contained the word
  # "release". That is the bug this grammar exists to end, and the two fixtures
  # below are exactly the two PRs that told them apart:
  #
  #   func/filterfire  head=codex-changelog, title="changelog: publish each
  #                    release entry …"  → the inner AND is false → FIRES
  #   func/filterskip  head=staging, title="Release 2.4.0"
  #                    → the inner AND is true → SKIPPED
  #
  # Parentheses, `!` over a group, `contains()` and a fact comparison all have
  # to work for the fire/skip split to come out right — a filter that failed to
  # parse would fail closed and neither would fire, and one that dropped the
  # grouping would fire both.
  - on: gh.review_requested
    name: unified-filter
    filter:
      repo: ["func/filterfire", "func/filterskip"]
      expr: "!is_draft && !( (head_branch == 'staging' || head_branch == 'prod') && contains(title, 'Release ') )"
    steps:
      - id: tell
        uses: slack.post
        options: { channel: CFILTER, text: "U-FILTER fired {{.repo}}#{{.pr}}" }

checks:
  # A code check that always passes / always fails — a crisp pass/fail verdict
  # with no external dependency, so the §16 gate machinery is what's under test.
  always-pass: { use: cli, command: [sh, -c, 'printf %s "{\"pass\": true, \"reason\": \"ok\"}"'] }
  always-fail: { use: cli, command: [sh, -c, 'printf %s "{\"pass\": false, \"reason\": \"still broken\"}"'] }

policy:
  concurrency: { max_agents: 3 }

# §13 callable service: the invoke surface group S drives. Binds inside this
# container; run.sh curls it as localhost:8099. One bearer token, scoped
# deny-by-default to callable-summary only (callable-scoped is deliberately
# out of scope). Literal secret — hermetic stack, no env plumbing.
callable:
  listen: "0.0.0.0:8099"
  wait_timeout: 20s
  # The callback sink (sink-catcher) sits on the private Docker network over
  # plain http, so the SSRF guard (#36 §13 review item 1) blocks it by default.
  # Opt it back in explicitly — proving BOTH the default-deny and the opt-in
  # path. Listed by NAME (its Docker IP is assigned at runtime, not pinnable);
  # `callback-blocked` below is a second sink that is deliberately NOT listed, so
  # the group also covers the default block.
  callback_allow_http: true
  callback_allow_hosts: [sink-catcher]
  tokens:
    - name: n8n-e2e
      bearer: "e2e-invoke-token"
      workflows: [callable-summary]

# The notify: block is retired — alerting is triggers on the conductor.*
# lifecycle source (this stack asserts verbs/grouping, not sink delivery).

store:
  state_file: /data/state.json
  audit_log: /data/audit.jsonl

# K9ctx: the two stores the `cli` engine's ctx data plane reaches over its
# per-run socket. k9sql takes the round trip; k9locked exists to be REFUSED —
# code_access: none is a host-side gate, so a cli step asking for it gets a
# denial from the daemon rather than a connection.
#
# Both are sqlite rather than boltdb because this same config is what K4's
# `conductor connectors ls` loads in this container: boltdb holds an
# exclusive file lock for the running daemon's lifetime, so any CLI
# subcommand that builds the stores would block on it. (A property of boltdb,
# not of the data plane — the kv face is covered by the ctx socket's own
# subprocess tests, and by the undefined-store refusal below.)
stores:
  k9sql: { type: sqlite, code_access: write }
  k9locked: { type: sqlite, code_access: none }
