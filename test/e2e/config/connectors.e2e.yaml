# Connectors-model config for the e2e stack (group K): a github connector
# receiving signed fixture webhooks, a slack connector whose Web API base is
# the sink-catcher (PC_SLACK_API_URL), an SSH host looping back to this
# container's own sshd, and triggers exercising cross-boundary steps, hooks,
# js code steps, grouping, and remote execution. Hermetic — no egress.

connectors:
  gh:
    use: github
    app:
      app_id: 123456
      private_key_path: /etc/conductor/github-app.pem
      webhook_secret: e2e-webhook-secret
      verify_signature: true
    webhook:
      listen: "0.0.0.0:8787"
      path: /webhook
    sweep: { enabled: false }
    me: { logins: [conductor-user] }
    identity:
      read_token: app
      write_token: e2e-user-write-token # literal token; no gh binary in the image

  slack:
    use: slack
    # Verbs only (no slack triggers), so no Socket Mode connection is opened;
    # bot_token is all the verb face needs. The API base comes from
    # PC_SLACK_API_URL (the sink-catcher's slack-shaped endpoint).
    bot_token: xoxb-e2e-dummy
    options: { channel: CDEFAULT }

  # K7: an ask-capable web connector — its draft pages serve on :8095 inside
  # this container; the harness drives approve/revise/discard over HTTP.
  page:
    use: web
    base_url: "http://localhost:8095"
    listen: ":8095"
    ttl: 5m

hosts:
  selfbox:
    host: 127.0.0.1 # this container's own sshd (started by entrypoint-conn.sh)
    user: root
    key: /root/.ssh/id_ed25519
    known_hosts: /root/.ssh/known_hosts
    # A remote paseo runtime gets its runtime env from the host entry — ssh
    # carries no local process env across.
    env:
      FORGE_BASE: "git://forge/"
      FAKE_PASEO_STATE: /data/fakepaseo
      PC_GITHUB_API_BASE: "http://mock-github:8080"

runtimes:
  paseo: { use: paseo, bin: /usr/local/bin/fakepaseo, default: true }
  # K6: a paseo runtime on an SSH host — every paseo CLI call (run/ls/send/
  # archive/clone/workspace) executes on selfbox over ssh.
  gpu: { use: paseo, bin: /usr/local/bin/fakepaseo, host: selfbox }

x-templates:
  fixer: &fixer
    type: agent
    name: fixer
    workspace: worktree
    archive_when_done: true
    wait_timeout: 5m
  remotefixer: &remotefixer
    type: agent
    name: remotefixer
    runtime: gpu
    workspace: worktree
    wait_timeout: 5m

triggers:
  # K1: cross-boundary workflow — an agent fixes the conflict while slack
  # hooks announce start and completion.
  - on: gh.merge_conflict
    filters: { repos: ["conn/cweb"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "Resolve the conflict on {{.repo}}#{{.pr}} against {{.base}}: rebase, fix, push."
    hooks:
      - { at: start, uses: slack.post, options: { channel: C1, text: "K1-start {{.repo}}#{{.pr}}" } }
      - { at: done, uses: slack.post, options: { channel: C1, text: "K1-done {{.repo}}#{{.pr}}" } }
      - { at: fail, uses: slack.post, options: { channel: C1, text: "K1-fail {{.error}}" } }

  # K5: remote execution — a host-interpreter code step runs over SSH on
  # selfbox (this container's sshd), its output flowing into a slack post.
  - on: gh.merge_conflict
    name: remote
    filters: { repos: ["conn/cweb"] }
    steps:
      - id: remote
        run: sh
        host: selfbox
        code: |
          printf '{"where":"%s","user":"%s"}' "$(hostname)" "$(id -un)"
      - id: tell
        uses: slack.post
        options: { channel: C5, text: "K5-remote {{.remote.where}} as {{.remote.user}}" }

  # K6: an agent on the REMOTE paseo runtime — the whole dispatch
  # (clone, worktree, run, wait) rides the ssh channel.
  - on: gh.merge_conflict
    name: remote-agent
    filters: { repos: ["conn/rweb"] }
    steps:
      - id: fix
        type: agent
        <<: *remotefixer
        prompt: "Resolve the conflict on {{.repo}}#{{.pr}} against {{.base}}: rebase, fix, push."
    hooks:
      - { at: done, uses: slack.post, options: { channel: C6, text: "K6-done {{.repo}}#{{.pr}}" } }

  # K2: a js code step reshapes the comment, a verb posts the result.
  - on: gh.new_comment
    filters: { repos: ["conn/csvc"] }
    steps:
      - id: shape
        run: js
        code: "return { msg: 'seen ' + ctx.comment_body }"
      - id: post
        uses: slack.post
        options: { channel: C2, text: "K2 {{.shape.msg}}" }

  # K7: request-response — web.ask presents a draft page per decision and the
  # workflow reads each answer; a slack post reports all three outcomes.
  - on: gh.new_comment
    filters: { repos: ["conn/cask"] }
    steps:
      - { id: a1, uses: page.ask, options: { prompt: "K7 approve this?", draft: "{{.comment_body}}", timeout: 120s } }
      - { id: a2, uses: page.ask, options: { prompt: "K7 revise this?", draft: "v1", timeout: 120s } }
      - { id: a3, uses: page.ask, options: { prompt: "K7 discard this?", timeout: 120s } }
      - id: tell
        uses: slack.post
        options: { channel: C7, text: "K7 {{.a1.action}}/{{.a2.action}}:{{.a2.text}}/{{.a3.action}}" }

  # K3: grouping — a burst of comments on one PR becomes ONE run.
  - on: gh.new_comment
    name: grouped
    filters: { repos: ["conn/csvc"] }
    group: { key: "{{.repo}}#{{.number}}", window: 2s }
    steps:
      - id: batch
        uses: slack.post
        options: { channel: C3, text: "K3-batch {{.group.count}} last={{.group.last.comment_body}}" }

  # ---------------------------------------------------------------------------
  # Functional groups for #36 §14/§16/§17/§20/§21 (func/* repos). Each trigger
  # drives the REAL engine path and its group in run.sh asserts the feature's
  # observable side-effect (audit rows, forge commits, blob digests, history
  # records, live watch stream), and would go red if the feature were gutted.
  # ---------------------------------------------------------------------------

  # M (§14 cost): the fake agent reports exact token/$ usage in its run JSON
  # (the `[[usage …]]` directive); conductor's meter charges the REPORTED
  # figure (not an estimate) and writes an agent_usage audit row + report spend.
  - on: gh.merge_conflict
    name: cost
    filters: { repos: ["func/cost"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} [[usage in=1234 out=567 cost=0.0421]]"

  # N (§14 budget): a workflow spend cap smaller than one run's cost. The first
  # event runs (charges 0.0421), the second is SHED (0.0421 ≥ 0.03 cap) and its
  # agent step never pushes; after the window frees, a third event runs again.
  - on: gh.merge_conflict
    name: budget
    filters: { repos: ["func/budget1", "func/budget2", "func/budget3"] }
    policy:
      budget: { max_cost_usd: 0.03, window: 8s }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} [[usage in=1234 out=567 cost=0.0421]]"

  # O (§16 gate — PASS): the agent's change is gated by a check that passes, so
  # the downstream promote step fires.
  - on: gh.merge_conflict
    name: gatepass
    filters: { repos: ["func/gatepass"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}}"
        gate: { run: [always-pass], max_revisions: 1 }
      - id: promote
        uses: slack.post
        options: { channel: CGATE, text: "GATEPASS-promoted {{.repo}}" }

  # O (§16 gate — FAIL): the same shape but the gate check always fails. After
  # the bounded revise loop the gate escalates and the step FAILS, so the
  # downstream promote step is suppressed — gutting the gate would let it fire.
  - on: gh.merge_conflict
    name: gatefail
    filters: { repos: ["func/gatefail"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}}"
        gate: { run: [always-fail], max_revisions: 1 }
      - id: promote
        uses: slack.post
        options: { channel: CGATE, text: "GATEFAIL-promoted {{.repo}}" }

  # P (§21 blob): a step stores a known payload as a run-scoped content-addressed
  # blob; a later step reads it back BYTE-IDENTICAL. The slack post carries both
  # the digest (content addressing) and the round-tripped text.
  - on: gh.new_comment
    name: blob
    filters: { repos: ["func/blob"] }
    steps:
      - id: put
        uses: blob.put
        options: { text: "conductor-blob-e2e-payload", name: "payload.txt" }
      - id: read
        uses: blob.read
        options: { blob: "{{.put.blob}}" }
      - id: tell
        uses: slack.post
        options: { channel: CBLOB, text: "BLOB digest={{.put.digest}} text={{.read.text}}" }

  # Q (§20 history): a multi-step workflow so the recorded run shows per-step
  # inputs/outputs; run.sh lists it, inspects it, and retries from a step.
  - on: gh.merge_conflict
    name: hist
    filters: { repos: ["func/hist"] }
    steps:
      - id: prep
        run: js
        code: "return { note: 'hist-prep' }"
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} note={{.prep.note}}"
      - id: tell
        uses: slack.post
        options: { channel: CHIST, text: "HIST-done {{.repo}} note={{.prep.note}}" }

  # R (§17 watch + diff): the agent leaves its edit UNCOMMITTED (`[[dirty]]`) so
  # the run carries a proposed diff. run.sh attaches `conductor watch` before the
  # event and asserts the live event stream AND the diff text in the history JSON.
  - on: gh.merge_conflict
    name: watch
    filters: { repos: ["func/watch"] }
    steps:
      - id: fix
        type: agent
        <<: *fixer
        prompt: "fix {{.repo}} [[dirty]]"

  # S (§13 callable): invoked over HTTP by an external orchestrator, not a
  # webhook. `callable: true` opts the trigger into the invoke surface; the
  # n8n-e2e token (below) scopes it. A js step echoes the caller's input (proving
  # inputs flow in under .who / .inputs.who) and a slack post makes the async run
  # observable; the js output surfaces in the structured GET /runs result.
  - on: manual
    name: callable-summary
    callable: true
    steps:
      - id: echo
        run: js
        code: "return { greeting: 'hi ' + (ctx.who || 'nobody') }"
      - id: tell
        uses: slack.post
        options: { channel: CCALL, text: "CALLABLE-done who={{.who}} greeting={{.echo.greeting}}" }

  # S (scope): a second callable workflow the n8n-e2e token does NOT list. Proves
  # deny-by-default scope — invoking it with that token is a uniform 403 and this
  # step must never run.
  - on: manual
    name: callable-scoped
    callable: true
    steps:
      - id: tell
        uses: slack.post
        options: { channel: CCALL, text: "CALLABLE-scoped-LEAKED" }

checks:
  # A code check that always passes / always fails — a crisp pass/fail verdict
  # with no external dependency, so the §16 gate machinery is what's under test.
  always-pass: { run: js, code: "return { pass: true, reason: 'ok' }" }
  always-fail: { run: js, code: "return { pass: false, reason: 'still broken' }" }

policy:
  concurrency: { max_agents: 3 }

# §13 callable service: the invoke surface group S drives. Binds inside this
# container; run.sh curls it as localhost:8099. One bearer token, scoped
# deny-by-default to callable-summary only (callable-scoped is deliberately
# out of scope). Literal secret — hermetic stack, no env plumbing.
callable:
  listen: "0.0.0.0:8099"
  wait_timeout: 20s
  # The callback sink (sink-catcher) sits on the private Docker network over
  # plain http, so the SSRF guard (#36 §13 review item 1) blocks it by default.
  # Opt it back in explicitly — proving BOTH the default-deny and the opt-in
  # path. Listed by NAME (its Docker IP is assigned at runtime, not pinnable);
  # `callback-blocked` below is a second sink that is deliberately NOT listed, so
  # the group also covers the default block.
  callback_allow_http: true
  callback_allow_hosts: [sink-catcher]
  tokens:
    - name: n8n-e2e
      bearer: "e2e-invoke-token"
      workflows: [callable-summary]

# The notify: block is retired — alerting is triggers on the conductor.*
# lifecycle source (this stack asserts verbs/grouping, not sink delivery).

store:
  state_file: /data/state.json
  audit_log: /data/audit.jsonl
