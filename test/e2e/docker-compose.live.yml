# Live-mode override (manual): `make e2e-live` layers this on top of
# docker-compose.yml. It swaps the hermetic stub runtimes for the REAL agent CLIs
# installed on the host, driven by REAL credentials. NEVER run this in CI — it needs
# secrets and reaches real model providers.
#
# The forge, mock-github and sink-catcher stay in place (still no production GitHub),
# so live mode validates that the *real* agent does the work against the isolated
# forge, while conductor's GitHub reads/writes stay mocked. fakepaseo still provisions
# the PR worktree (a real git clone, no LLM); the real agent then edits/commits/pushes.
#
# What's wired (this box): cli:claude-code, cli:codex, acp:gemini, acp:omp, agent-deck.
# Not installed here → skipped in controllers.live.yaml with a note: opencode, copilot,
# and codex-acp (the acp:codex-adapter binary).
#
# Host tool + credential locations are parameterized; the defaults match this box.
# Override via env (e.g. HOST_LOCAL_BIN=/somewhere) before `make e2e-live`.

services:
  conductor:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.live
    image: paseo-conductor-e2e-live:latest
    environment:
      HOME: /home/conductor
      # Host tools live under /opt/host-local (mounted below); real static bins
      # (codex, omp) are mounted straight onto /usr/local/bin. node comes from the
      # image. Prepend the host bin dir so `gemini`/`claude`/`agent-deck` resolve.
      PATH: "/opt/host-local/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
      # Real model-provider credentials the live agents need. Populate from your
      # shell/secret store — never commit these. (omp reads WAFER_SERVERLESS_API_KEY.)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      WAFER_SERVERLESS_API_KEY: "${WAFER_SERVERLESS_API_KEY:-}"
      # The real agent posts comments itself; disable the fake-paseo comment shim.
      FAKE_PASEO_POST_COMMENT: ""
    volumes:
      - ./config:/etc/conductor:ro
      - ./fixtures:/fixtures:ro
      # Host tool tree (bin + lib/node_modules for the Node CLIs like gemini).
      - ${HOST_LOCAL:-${HOME}/.local}:/opt/host-local:ro
      # Static ELF tools installed system-wide on the host.
      - ${HOST_CODEX:-/usr/bin/codex}:/usr/local/bin/codex:ro
      - ${HOST_OMP:-/usr/bin/omp}:/usr/local/bin/omp:ro
      # The claude wrapper (routes through the operator's TeamClaude proxy) exposed
      # as `claude` so the claude-code recipe's `claude -p …` resolves.
      - ${HOST_CLAUDE:-${HOME}/.local/bin/claude-teamclaude}:/usr/local/bin/claude:ro
      # Per-tool credential/config dirs, into the container user's HOME.
      - ${HOME}/.claude:/home/conductor/.claude:ro
      - ${HOME}/.codex:/home/conductor/.codex:ro
      - ${HOME}/.gemini:/home/conductor/.gemini:ro
    # Point at the live controller config (real CLIs; fakepaseo only provisions).
    command: ["bash", "/etc/conductor/entrypoint.sh", "/etc/conductor/controllers.live.yaml"]
