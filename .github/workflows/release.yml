name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          # mac (amd64 = Intel, arm64 = Apple Silicon) + linux (amd64, arm64, 386/x86)
          targets="darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/386"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            out="dist/paseo-conductor_${os}_${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/paseo-conductor
            # The project is renaming paseo-conductor -> conductor. Publish each
            # binary under BOTH names: the new `conductor_*` for fresh installs, and
            # the legacy `paseo-conductor_*` so already-deployed daemons (which
            # download that exact filename) keep auto-updating across the repo rename.
            cp "$out" "dist/conductor_${os}_${arch}"
          done
          ( cd dist && sha256sum * > checksums.txt )
          ls -la dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
