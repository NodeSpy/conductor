# The agent-sandbox canary (docs/design/agent-sandbox.md §9). conductor's
# built-in sandbox — Linux user namespaces + pivot_root, macOS Seatbelt — must
# hold on BOTH platforms: a fake agent (no model, no secrets) is launched
# through the real path (`conductor sandbox exec` against a throwaway daemon)
# and probed from inside, and the sandbox packages' tests run with the real
# backend REQUIRED (they fail, not skip, where it cannot be built).
#
# The paseo leg runs the provider-entry + sandbox exec path against the
# LATEST published paseo, so a paseo release that changes the CLI or config
# shape conductor depends on fails here first — on a schedule, and on demand.
name: sandbox-canary

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: allow unprivileged user namespaces (Ubuntu's AppArmor restricts them)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: sandbox packages, real backend required
        env:
          CONDUCTOR_REQUIRE_SANDBOX: "1"
        run: |
          go test -race -count=1 ./internal/sandbox/... ./internal/agentsandbox/... ./internal/gitpush/... ./internal/paseosetup/...
          go test -race -count=1 -run 'TestConfinedGit|TestSandboxApplies|TestDispatchIdentity|TestNonCredentialEnv|TestControllerRunnerBinds|TestOpencodeSandboxed|TestAgentDeckSandboxed|TestDeckWrapper' ./internal/controller/
      - name: canary — conductor sandbox exec around a fake agent
        run: bash test/sandbox-canary/run.sh

  # conductor's browser for agents (docs/wiki/Browser.md): a real Chrome in
  # the real sandbox against a local test site (no external network) — the
  # multi-step task, the proxy-enforced allowlist, logged-in sessions gated
  # by provenance, workspace confinement, evaluate gating, and credentials
  # (password, TOTP, push approval, a passkey through the virtual
  # authenticator) with origin binding and redaction.
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: allow unprivileged user namespaces (Ubuntu's AppArmor restricts them)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: which browser
        run: |
          if [ "$RUNNER_OS" = macOS ]; then ls -d "/Applications/Google Chrome.app" "/Applications/Chromium.app" 2>/dev/null || true
          else command -v google-chrome google-chrome-stable chromium chromium-browser || true; fi
      - name: browser packages, real browser and sandbox required
        shell: bash
        env:
          CONDUCTOR_REQUIRE_BROWSER: "1"
          CONDUCTOR_REQUIRE_SANDBOX: "1"
        run: |
          go test -race -count=1 -v ./internal/browser/...
          go test -race -count=1 -run 'TestBrowser|TestSplitBrowser|TestValidateBrowser|TestReadFresh' ./cmd/conductor/ ./internal/config/ ./internal/vaults/
      - name: on failure, the macOS sandbox's denials for the browser
        if: failure() && runner.os == 'macOS'
        run: |
          log show --last 15m --style compact --predicate 'eventMessage CONTAINS "deny"' 2>/dev/null | grep -i -E 'chrom|google' | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<id>/g' | sort | uniq -c | sort -rn | head -80 || true

  paseo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: install the latest published paseo
        run: |
          npm install -g @getpaseo/cli@latest
          paseo --version
      - name: canary — paseo provider entries + conductor sandbox exec
        run: bash test/sandbox-canary/paseo.sh
