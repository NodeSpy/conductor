<script>
/* Theme, before first paint. An explicit choice (?theme=light|dark, the toggle, or one saved earlier) always
   wins over the OS, for every surface and text colour; ?theme=auto clears it. With no explicit choice the page
   follows the OS (prefers-color-scheme), live. Exactly one theme is ever applied: all tokens come from
   [data-theme], and no stylesheet reads prefers-color-scheme. ?sim=ios is a test-only iPhone emulation. */
(function () {
  var q = new URLSearchParams(location.search), t = q.get('theme'), saved = null;
  try { if (t === 'auto') localStorage.removeItem('cd-theme'); else if (t === 'light' || t === 'dark') localStorage.setItem('cd-theme', t); saved = localStorage.getItem('cd-theme'); } catch (e) {}
  var explicit = t === 'light' || t === 'dark' ? t : saved === 'light' || saved === 'dark' ? saved : null;
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  var apply = function (th, src) { var h = document.documentElement; h.dataset.theme = th; h.dataset.themeSource = src; };
  apply(explicit || (mq && !mq.matches ? 'light' : 'dark'), explicit ? 'explicit' : 'os');
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) { if (document.documentElement.dataset.themeSource === 'os') { apply(e.matches ? 'dark' : 'light', 'os'); if (window.UI && UI.themeIcon) UI.themeIcon(); } });
  if (q.get('sim') === 'ios') { document.documentElement.classList.add('sim-ios'); try { sessionStorage.setItem('cd-sim', 'ios'); } catch (e) {} }
  else { try { if (sessionStorage.getItem('cd-sim') === 'ios') document.documentElement.classList.add('sim-ios'); } catch (e) {} }
})();
</script>
