# tygo generates web/src/api/types.ts from the Go API contract. Run with:
#   make web-types        (from the repo root)
# The generated file is committed; this config is the source-of-truth mapping.
packages:
  - path: github.com/NodeSpy/conductor/internal/dashboard/api
    output_path: src/api/types.ts
    type_mappings:
      "any": "unknown"
    frontmatter: |
      // Code generated by tygo from internal/dashboard/api. DO NOT EDIT.
      // Regenerate with `make web-types`.
