# paseo-conductor configuration.
# Copy to ~/.config/paseo-conductor/config.yaml and edit.
# ${ENV} references are expanded from the environment (see conductor.env).

integrations:
  # A LIST of typed instances. List `github` more than once for separate
  # Apps/orgs (each App has its own webhook secret).
  - type: github
    name: github
    enabled: true
    # The App carries webhooks + ALL API reads/enrichment (its own rate pool).
    # Writes/posts use your gh token; commits/pushes go over SSH as you.
    app:
      app_id: 0
      private_key_path: ~/.config/paseo-conductor/github-app.pem
      webhook_secret: ${GH_WEBHOOK_SECRET}
      # smee re-serializes the JSON body, so HMAC often won't match — leave this
      # false with smee. With a DIRECT `listen` receiver the raw body is intact,
      # so set it true there.
      verify_signature: false
    webhook:
      # Use smee.io (no inbound port) and/or a direct HTTP listener — set either
      # or both. A direct listener is ideal behind your own tunnel (e.g. pangolin).
      smee_url: ${GH_SMEE_URL}       # https://smee.io/<channel>
      # listen: 127.0.0.1:8787        # direct receiver; point the App webhook (or your tunnel) here
      # path: /webhook                # default
    sweep:
      enabled: false                  # off by default; catch-up only
      interval: 1h
      repos: ["your-org/your-repo"]

    # OPTIONAL shared defaults; every rule merges over these.
    defaults:
      reviewer: { logins: [your-login], teams: [] }
      assignee: { logins: [your-login] }
      actions:
        merge_conflict:
          type: agent
          agent: fixer
          max_attempts_per_head: 2
          prompt: |
            This PR conflicts with base {{.base}}. Merge/rebase base, resolve the
            conflicts, make sure it builds, commit, and push to the PR branch.
        pr_behind:
          type: command
          backend: local
          command: ["gh", "pr", "update-branch", "{{.repo}}#{{.pr}}"]
          env: { GH_TOKEN: "{{.gh_token}}" }
        failing_checks:
          type: agent
          agent: fixer
          flaky_rerun: { enabled: true, max: 1 }
          prompt: |
            Checks are failing on {{.repo}}#{{.pr}}. Use `gh pr checks` and
            `gh run view --log-failed` to diagnose, fix, verify locally, commit, and push.
        changes_requested:
          type: agent
          agent: fixer
          prompt: |
            A reviewer requested changes on {{.repo}}#{{.pr}}. Read the review with
            `gh pr view --comments`, address each point, commit, push, and reply to threads.
        new_comment:
          type: agent
          agent: fixer
          from_users: []              # empty = any author; e.g. ["coderabbitai[bot]"]
          prompt: |
            New comment on {{.repo}}#{{.pr}} by {{.author}}: {{.comment_body}}
            If actionable, make the change, commit, push, and reply.
        # critique auto-review (others' PRs where your review is requested)
        review_requested:
          type: command
          backend: local
          command: ["critique", "--review", "{{.repo}}#{{.pr}}", "--post"]
          env:
            CRITIQUE_GITHUB_TOKEN: "{{.app_token}}"   # reads on App pool
            CRITIQUE_SUBMIT_TOKEN: "{{.gh_token}}"    # submits review as YOU
        # critique your own PRs when you open/update them (set enabled: true to use)
        self_review:
          type: command
          backend: local
          enabled: false
          checkout: none
          command: ["critique", "--review", "{{.repo}}#{{.pr}}"]
          env:
            CRITIQUE_GITHUB_TOKEN: "{{.app_token}}"
            CRITIQUE_SUBMIT_TOKEN: "{{.gh_token}}"
        # issues
        issue_assigned:
          type: agent
          agent: fixer
          checkout: branch-off
          prompt: |
            Issue {{.repo}}#{{.issue}} was assigned to you. Start work: create a branch,
            implement a fix, and open a draft PR.
        # A MULTI-STEP workflow: plan with a cheap model, then branch on its output.
        #   1) evaluate the issue for enough context (planner model, structured output)
        #   2) if enough  -> implement it (stronger model)
        #   3) if not     -> comment asking the reporter for more detail
        issue_ready:
          labels_any: ["Ready"]         # gate: only issues labeled "Ready"
          steps:
            - id: evaluate
              type: agent
              agent: planner            # cheap model just to assess
              checkout: none            # assessing only — no branch/worktree
              output_schema:
                type: object
                additionalProperties: false
                required: [has_context, summary]
                properties:
                  has_context: { type: boolean }
                  summary: { type: string }
              prompt: |
                Assess issue {{.repo}}#{{.issue}}. Is there enough detail (repro,
                expected behavior, scope) to implement it? Return has_context (bool)
                and a one-line summary.
            - id: work
              if: "steps.evaluate.outputs.has_context == true"
              type: agent
              agent: fixer              # stronger model to do the work
              checkout: branch-off
              prompt: |
                Implement issue {{.repo}}#{{.issue}} — {{.steps.evaluate.outputs.summary}}.
                Create a branch, implement it, and open a draft PR.
            - id: ask
              if: "steps.evaluate.outputs.has_context == false"
              type: command
              backend: local
              command: ["gh", "issue", "comment", "{{.repo}}#{{.issue}}", "--body",
                        "Thanks for the issue! Could you add repro steps, expected behavior, and scope so it can be picked up?"]
              env: { GH_TOKEN: "{{.gh_token}}" }
        # a Projects v2 Status field moving to "Ready" (one GraphQL lookup per event; set enabled: true)
        issue_project_moved:
          type: agent
          agent: fixer
          enabled: false
          checkout: branch-off
          project: { field: Status, to: Ready }
          prompt: "Issue {{.repo}}#{{.issue}} moved to Ready in the project — start work."
        # auto-merge a PR once it's fully green (higher-stakes; set enabled: true to turn on)
        merge_ready:
          type: command
          backend: local
          enabled: false
          require_label: automerge       # PR must carry this label to be eligible
          method: squash                 # squash | merge | rebase
          gates: { merge_state: clean, review_decision: approved, non_author_approval: true, threads_resolved: true, not_draft: true }
          command: ["gh", "pr", "merge", "{{.repo}}#{{.pr}}", "--squash"]
          env: { GH_TOKEN: "{{.gh_token}}" }

    # RULES: primary structure. FIRST rule whose `match` applies wins; it merges
    # over `defaults`. `match` selects repos by glob (e.g. owner/*, */*).
    rules:
      - match: { repos: ["your-org/*"] }
      - match: { repos: ["your-org/your-repo"] }
        actions:
          failing_checks: { agent: fixer, prompt: "checks failing on {{.repo}}#{{.pr}} — diagnose, fix, push." }

  # A schedule-driven integration: run commands or agents on a cron/interval.
  - type: cron
    name: chores
    schedules:
      - name: rate-limit-check
        every: 6h                     # or `cron: "0 */6 * * *"` / "@every 6h"
        action:
          type: command
          backend: local
          command: ["gh", "api", "rate_limit"]
      - name: tidy-cache
        cron: "0 4 * * *"             # standard 5-field cron (also supports @daily/@hourly)
        run_on_start: false
        action:
          type: command
          backend: local
          workdir: ~/Projects/myrepo   # run the command here ('~' and {{.repo}}-style templates allowed)
          command: ["make", "clean"]

control:
  enabled: true
  pause_label: conductor:off          # (label-based pause is a follow-up; enabled/shadow work today)
  shadow: false                       # run everything but skip the final push/merge/post
notify:
  push: true
  comment_on_escalate: true
  on: [dispatch, escalate]

agents:
  fixer:
    provider: claude
    model: ""                         # optional
    thinking: ""                      # optional
    mode: ""                          # optional
    workspace: worktree               # local | worktree
    wait_timeout: 30m
    archive_when_done: true
    labels: { team: autopilot }
  planner:                            # cheaper/faster model for planning/triage steps
    provider: claude
    model: claude-haiku-4-5-20251001
    workspace: local
    archive_when_done: true

dispatch:
  default_backends: { agent: paseo, command: local }
  backends:
    paseo: { bin: paseo }
    local: {}
  identity: { read_token: app, write_token: gh_auth, commit_author: self }

update:
  auto: false                          # periodically self-update to the latest release
  interval: 8h                         # check cadence (a few times a day)
  apply: true                          # re-exec into the new binary after updating

store:
  state_file: ~/.local/state/paseo-conductor/state.json
  audit_log: ~/.local/state/paseo-conductor/audit.jsonl
  state_ttl: 720h
  max_tracked_prs: 5000
  audit_max_size: 50MB

dry_run: false
