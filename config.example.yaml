# conductor — example configuration (connectors model).
#
# Connect to services once (connectors:), declare where agents run (runtimes:)
# and who they are (agents:), then wire events to work (triggers:). A trigger
# is four keys — on / filters / steps / hooks — and a step can run an agent,
# run a command, run inline code, call any connector's verb, or call a
# reusable workflow. Everything here is optional except at least one trigger
# (or a legacy integrations: block — the previous schema still loads, and
# `conductor config migrate` converts it; see config.example.legacy.yaml).
#
# Secrets: ${VAR} / env:VAR reads the environment / the sibling conductor.env
# — the implicit baseline, nothing to declare. Everything beyond env is a
# vault declared in vaults: (below) and read with
# {{ vault "<name>" "<key>" }}. `conductor secrets check` unlocks every
# vault and resolves every reference without printing values.

# ---------------------------------------------------------------------------
# vaults: — named secret stores. Types: conductor (the built-in hardened
# encrypted vault.json — entry names and count are inside the ciphertext),
# onepassword (op CLI, read-only), pass (GPG store), file (a mounted dir of
# secret files, read-only), hashicorp (HashiCorp Vault KV v2). Each entry
# carries its connection + an unlock: bootstrap ref (env:VAR, file:/path,
# keyring:, creds: for systemd credentials — non-interactive, because the
# daemon restarts itself). Steps read/write with `uses: <name>.read` /
# `<name>.write` (write only on writable types); values are tainted and
# redacted from logs/audit. CLI: conductor vault <name> init|add|get|ls|rm.
# ---------------------------------------------------------------------------
# vaults:
#   house: { type: conductor }                  # ~/.config/conductor/vault.json
#   op:    { type: onepassword, account: acme, service_account: env:OP_SA }
#   store: { type: pass, prefix: conductor }
#   files: { type: file, dir: /run/secrets }
#   hcv:   { type: hashicorp, addr: https://vault.internal, unlock: { token: env:VAULT_TOKEN } }

# ---------------------------------------------------------------------------
# connectors: — external services. Each has two faces: events you can trigger
# on (`on: <name>.<event>`) and verbs you can call (`uses: <name>.<verb>`).
# `conductor connectors ls` lists them; `conductor schema <name>` prints every
# event's filters/context and every verb's options/outputs.
#
# Any section splits across files — `imports:` (plural) lists files/globs,
# `import:` (singular) loads one file. A map section takes an `imports:` key
# (entries merge; a duplicate name across files is a load error); a named
# entry loads its body from a file (`pd: { import: ./conf.d/pd.yaml }`); the
# triggers: list takes the same plural key as items (`- imports: [globs]`). A step pulls one workflow straight
# from a file: `workflow: name, import: ./workflows/review.yaml`, or a bare
# `workflow: ./workflows/review.yaml` when the file defines a single workflow.
# ---------------------------------------------------------------------------
connectors:
  # imports: [conf.d/connectors/*.yaml]   # split entries across files
  gh:
    type: github
    # Credentials resolve app → token → the gh CLI (`gh auth token`). With an
    # App you get webhook installs + a separate read-rate pool; without one, a
    # plain webhook (+ secret) or the sweep delivers events and a PAT (or your
    # gh login) covers reads. Repo globs in sweeps need an App.
    app:
      app_id: 123456
      private_key_path: ~/.config/conductor/github-app.pem
      webhook_secret: ${GH_WEBHOOK_SECRET}
    # token: ${GH_PAT}                  # the App-less alternative
    webhook:
      smee_url: ${GH_SMEE_URL} # and/or a direct listener:
      # listen: "127.0.0.1:8787"
      # path: /webhook
    sweep: { enabled: true, repos: ["your-org/*"] }
    me: { logins: [your-login] } # defines "you" (your PRs, your reviews)
    repos: ["your-org/*"] # default repo scope for triggers with no repos filter
    identity: { read_token: app, write_token: gh_auth, commit_author: self }
    # Default verb options: every gh verb call merges over these (call wins).
    # `as: me` posts as you; `as: bot` (per call or here) posts as the App.
    options: { as: me }
    policy:
      ignore: { users: ["dependabot[bot]", your-login] }
      pause_label: "conductor:hold" # label that parks a PR/issue
      rate_limits: { per_minute: 60 } # outbound verb cap
      backoff: { base: 10s, max: 30m } # retry cadence past the attempt threshold
      # reply_to_bots: decline_only  # bot-authored comments: decline_only (default) | off | full

  slack-ops:
    type: slack
    app_token: ${SLACK_APP_TOKEN} # Socket Mode (events in)
    bot_token: ${SLACK_BOT_TOKEN} # posting (verbs out)
    options: { channel: C0123456789 } # default channel for post/ask

  # An ask-capable web page (approve / revise / discard) served on the inbound
  # listener — `uses: hoff.ask` presents a draft there and waits.
  hoff:
    type: web
    base_url: https://conductor.example.com
    listen: ":8099"
    ttl: 30m
    # tunnel: { provider: cloudflared }   # or lan|ngrok|tailscale|ssh|command

  # discord-ops:
  #   type: discord
  #   bot_token: ${DISCORD_BOT_TOKEN}
  #   options: { to: dm, user: "189..." }

  # A command connector: `uses: build-box.run` executes a command — on the
  # named hosts: entry over SSH, or locally when host:/ssh: is absent.
  # Outputs: stdout, stderr, exit_code (a non-zero exit is data, not an error).
  # build-box:
  #   type: command
  #   host: build-box            # a hosts: entry; or inline ssh: {host: …}
  #   cwd: /srv/build
  #   env: { CI: "1" }

  timer:
    type: cron
    schedules:
      nightly-tidy: { cron: "0 4 * * *" }
      weekly-audit: { cron: "0 5 * * 0" }
      rate-check: { every: 6h, run_on_start: true }

  hooks:
    type: webhook
    listen: ":8099" # shared with other listeners on the same address
    sources:
      cloudwatch:
        path: /hooks/cloudwatch
        sign: { header: X-Signature-256, secret: ${CW_SECRET}, scheme: sha256 }
        match: '{{if eq .body.detail.state "ALARM"}}true{{end}}'
        title: "{{.body.detail.alarmName}}"
        dedup: "{{.body.detail.alarmName}}-{{.body.time}}"

  # sentry-prod:
  #   type: sentry
  #   listen: ":8098"
  #   client_secret: ${SENTRY_CLIENT_SECRET}
  # pd:
  #   type: pagerduty
  #   listen: ":8097"
  #   signing_secret: ${PAGERDUTY_SIGNING_SECRET}
  # upstream:
  #   type: rss
  #   feeds:
  #     changelog: { url: https://example.com/releases.atom, interval: 30m }

  # type: rest — any HTTP API, declared entirely in config. You declare the
  # verbs (method + templated path/query/headers/body, `expect:` success
  # statuses defaulting to 2xx, `output:` templates over the parsed response)
  # and optionally polled `events:` (a request, a `list:` template naming the
  # response array, an `id:` template for dedup, `context:` fields published
  # to the trigger). Templates see {{.options.*}}, {{ vault … }} reads, and — in
  # outputs — {{.response.status/body/headers}}; events add {{.item.*}}. The
  # `json` filter encodes a structured option as a JSON body.
  # auth: is shared with graphql: none | bearer{token} | basic{username,
  # password} | header{name,value} | oauth2{grant, token_url, client_id,
  # client_secret, token_vault, scopes, auth_url, device_auth_url,
  # redirect_uri}. oauth2 grants: client_credentials | refresh_token |
  # authorization_code | device. Tokens are fetched and cached per connector,
  # refreshed ahead of expiry and once on a 401; the captured access +
  # refresh tokens live in token_vault (a vaults: entry) and rotations are
  # written back there. Log in once with `conductor connector auth <name>`;
  # `connector auth ls` shows each connector's state + expiry.
  # xero:
  #   type: rest
  #   base_url: https://api.xero.com/api.xro/2.0
  #   auth:
  #     type: oauth2
  #     grant: refresh_token
  #     token_url: https://identity.xero.com/connect/token
  #     auth_url: https://login.xero.com/identity/connect/authorize
  #     client_id: ${XERO_CLIENT_ID}
  #     client_secret: '{{ vault "house" "xero-client-secret" }}'
  #     token_vault: house                     # captured tokens + rotations persist here
  #     scopes: [accounting.transactions, offline_access]
  #   headers: { Accept: application/json, Xero-Tenant-Id: "${XERO_TENANT_ID}" }
  #   verbs:
  #     list_invoices:
  #       method: GET
  #       path: /Invoices
  #       query: { where: 'Contact.ContactID==Guid("{{.options.contact}}")' }
  #       output: { invoices: "{{.response.body.Invoices}}" }
  #     create_invoice:
  #       method: POST
  #       path: /Invoices
  #       body: "{{ .options.invoice | json }}"
  #       output: { id: "{{ (index .response.body.Invoices 0).InvoiceID }}" }
  #   events:
  #     new_invoice:
  #       poll: 10m
  #       request: { path: /Invoices, query: { order: "UpdatedDateUTC DESC" } }
  #       list: "{{.response.body.Invoices}}"
  #       id: "{{.item.InvoiceID}}"
  #       context: { title: "invoice {{.item.InvoiceNumber}}", total: "{{.item.Total}}" }

  # type: graphql — one endpoint, verbs are named queries/mutations with
  # templated variables:. Variables keep their types (a sole {{.path}} stays
  # a list/map/number). The request is POST {query, variables}; a non-empty
  # errors array fails the verb even on HTTP 200; output: templates read
  # {{.response.data.*}}.
  # shop:
  #   type: graphql
  #   endpoint: https://myshop.myshopify.com/admin/api/2025-01/graphql.json
  #   auth: { type: header, name: X-Shopify-Access-Token, value: '{{ vault "house" "shopify-token" }}' }
  #   verbs:
  #     create_order:
  #       query: |
  #         mutation($id: ID!, $lines: [OrderLineInput!]!) {
  #           orderCreate(customerId: $id, lines: $lines) { order { id name } }
  #         }
  #       variables: { id: "{{.options.customer}}", lines: "{{.options.lines}}" }
  #       output: { order_id: "{{.response.data.orderCreate.order.id}}" }

# ---------------------------------------------------------------------------
# hosts: — named SSH targets. Reference one with `host:` from a code step, a
# command step, an agent profile, or a cli/acp runtime; conductor runs the
# work there via the system ssh (key auth + known_hosts, BatchMode).
# ---------------------------------------------------------------------------
hosts:
  build-box: { host: build01.internal, user: ci, key: ~/.ssh/id_ed25519 }

# ---------------------------------------------------------------------------
# stores: — named data stores in two families. KV types (boltdb/redis/http)
# are served by the kv.* verbs; SQL types (postgres/mysql/sqlite, pure-Go
# drivers) by sql.query/sql.exec. Every store is explicit (no defaults); a
# data verb picks one with its required `store:` option, and the family is
# checked at load. boltdb = one pure-Go file per store (path:, or
# <data dir>/<name>.db); redis maps to native ops with Lua-scripted
# read-modify-writes; http is a generic REST shim (POST base_url, one JSON
# op per request — the shim owns RMW atomicity) reusing the rest auth block.
# SQL stores run statements against your existing schema (conductor manages
# no migrations); statements are parameterized only — values bind through
# args: to driver placeholders ($1 postgres, ? mysql/sqlite), never into
# the sql text.
# ---------------------------------------------------------------------------
# stores:
#   state: { type: boltdb }                    # <data dir>/state.db
#   archive: { type: boltdb, path: /mnt/big/archive.db }
#   cache: { type: redis, url: "redis://10.0.0.5:6379/0", password: '{{ vault "house" "redis_pw" }}' }
#   shared:
#     type: http
#     base_url: https://kv.example.com/kv
#     auth: { type: bearer, token: '{{ vault "house" "kv-shim" }}' }
#   analytics: { type: postgres, url: "postgres://conductor@db/analytics", password: '{{ vault "house" "pg" }}' }
#   billing: { type: mysql, dsn: "conductor:@tcp(db:3306)/billing", password: '{{ vault "house" "mysql" }}' }
#   local: { type: sqlite }                    # <data dir>/local.sqlite

# ---------------------------------------------------------------------------
# runtimes: — where agents run (previously controllers:). The paseo runtime's
# bin: replaces the old top-level paseo_bin. Any runtime may set host: to run
# on a hosts: entry over SSH — a remote paseo runs its whole CLI there (put
# its environment on the host entry's env:), an opencode server is reached
# through an ssh -W forward, cli/acp/agent-deck wrap their launch.
# ---------------------------------------------------------------------------
runtimes:
  paseo: { type: paseo, bin: paseo, default: true }
  gpu-paseo: { type: paseo, bin: /usr/local/bin/paseo, host: build-box }
  # deck:   { type: agent-deck }
  # gemini: { agent: gemini }                       # ACP transport
  # remote: { type: cli, tool: claude-code, host: build-box }

# agents: — named profiles (provider/model/prompt posture), run on a runtime.
agents:
  fixer:
    provider: claude
    model: claude-sonnet-5
    workspace: worktree
    wait_timeout: 25m
    archive_when_done: true
    # runtime: paseo        # explicit runtime (default: the default: true one)
    # host: build-box       # pin this profile's runtime launches to a host
  planner:
    provider: claude
    model: claude-haiku-4-5
    archive_when_done: true

# ---------------------------------------------------------------------------
# workflows: — named, parameterized step lists with declared inputs/outputs,
# called from triggers via { workflow: <name>, with: {…} }.
# ---------------------------------------------------------------------------
workflows:
  assess-and-post:
    inputs:
      repo: { type: string, required: true }
      pr: { type: integer, required: true }
      channel: { type: string, default: C0123456789 }
    outputs:
      decision: "{{.triage.decision}}"
    steps:
      - id: triage
        type: agent
        agent: planner
        checkout: none
        output_schema:
          type: object
          required: [decision]
          properties: { decision: { enum: [auto, manual] } }
        prompt: "Assess {{.inputs.repo}}#{{.inputs.pr}}; decide auto vs manual."
      - id: ping
        if: "{{.triage.decision}} == manual"
        uses: slack-ops.post
        options: { channel: "{{.inputs.channel}}", text: "Needs a human: {{.inputs.repo}}#{{.inputs.pr}}" }

# ---------------------------------------------------------------------------
# triggers: — on / filters / steps / hooks (+ optional group / policy / name).
# Filters are AND-ed; their legal keys come from the event's schema. Steps see
# the trigger context plus every prior step's outputs; hooks see the same,
# scoped to when they fire (start: context only · done: + all outputs ·
# fail: + {{.error}}/{{.failed_step}}).
# ---------------------------------------------------------------------------
triggers:
  # Autonomous conflict fixer with Slack lifecycle hooks.
  - on: gh.merge_conflict
    steps:
      - id: fix
        type: agent
        agent: fixer
        prompt: |
          {{.repo}}#{{.pr}} has a merge conflict against {{.base}}.
          Rebase or merge, resolve, verify the build, and push.
    hooks:
      - { at: start, uses: slack-ops.post, options: { text: "conflict on {{.repo}}#{{.pr}} — on it" } }
      - { at: done, uses: slack-ops.post, options: { text: "resolved {{.repo}}#{{.pr}}" } }
      - { at: fail, uses: slack-ops.post, options: { text: "couldn't fix {{.repo}}#{{.pr}}: {{.error}}" } }

  # A poster's comment burst becomes ONE run (debounce; window resets per
  # event, fires when quiet; at most one run per key is in flight).
  - on: gh.new_comment
    filters: { ignore_users: ["ci-bot"] }
    group: { key: "{{.repo}}#{{.pr}}", window: 15s }
    steps:
      - id: handle
        type: agent
        agent: fixer
        prompt: |
          Address the review comments on {{.repo}}#{{.pr}}:
          {{range .group.events}}- {{.comment_body}}
          {{end}}
      - id: react
        uses: gh.comment
        options: { repo: "{{.repo}}", number: "{{.pr}}", body: "Addressed {{.group.count}} comment(s)." }

  # Multiple sources fan into one step list: a cron schedule, on-demand runs
  # (`conductor run repo-audit --input scope=all`), and a filtered GitHub
  # event. Each on: item is a bare conn.event or a one-key map whose value
  # is a per-source block: filters (validated against THAT source's schema
  # only; keys override the shared top-level filters:), policy (innermost
  # scope), hooks (appended after the shared hooks, for that source only).
  # Steps stay trigger-level. The trigger fires once per matching event from
  # any listed source; reference
  # source-specific fields defensively ({{.number | default ""}}). A trigger
  # reachable by `conductor run` requires a unique name:.
  - name: repo-audit
    on:
      - timer.weekly-audit
      - manual
      - gh.issue_matched:
          filters: { labels_any: [audit] }
          hooks:
            - { at: start, uses: gh.comment, options: { repo: "{{.repo}}", number: "{{.number}}", body: "auditing…" } }
    steps:
      - id: audit
        type: agent
        agent: fixer
        prompt: |
          Run the repo audit pass (scope: {{ .inputs.scope | default "changed" }}).
          {{ if .number }}Triggered by issue #{{.number}}.{{ end }}

  # The kv verbs serve the stores: section (see below) — every call names
  # its store. Verbs: get/set/setnx/merge/delete/incr/append/remove/contains/
  # first/last/index/slice/len/pop/list; namespaces isolate keyspaces; values
  # are JSON; ttl: expires a key; read-modify-writes are one backend
  # transaction. Read inline with {{ kv "state" "ns" "key" }} /
  # {{ kvContains "state" "ns" "key" .item }}; code steps get
  # ctx.store("state") (js/lua), store("state") (risor), or
  # import "conductor/store" + store.Use("state") (go-embed). Act once per
  # incident id, durably across runs and restarts:
  # - name: new-incidents
  #   on: [ pd.incident ]
  #   steps:
  #     - { id: gate, uses: kv.get, options: { store: state, namespace: pagerduty, key: last-seen, default: "" } }
  #     - if: "{{ .incident.id }} != {{ .gate.value }}"
  #       uses: slack-ops.post
  #       options: { channel: "#outages", text: "New incident {{ .incident.id }}" }
  #     - { uses: kv.set, options: { store: state, namespace: pagerduty, key: last-seen, value: "{{ .incident.id }}" } }

  # The sql verbs serve the stores: section's SQL types. sql.query returns
  # { rows, count }; sql.exec returns { rows_affected, last_insert_id? }
  # (last_insert_id is absent on postgres — use RETURNING with sql.query).
  # Event data binds through args: to driver placeholders; code steps get
  # ctx.sql("analytics") (js/lua), sql("analytics") (risor), or
  # import "conductor/sql" + sql.Use("analytics") (go-embed). Record each
  # incident as a row:
  # - name: record-incidents
  #   on: [ pd.incident ]
  #   steps:
  #     - uses: sql.exec
  #       options:
  #         store: analytics
  #         sql: "INSERT INTO incidents (id, urgency, title) VALUES ($1, $2, $3)"
  #         args: [ "{{.incident.id}}", "{{.incident.urgency}}", "{{.title}}" ]

  # Review triage through the reusable workflow + a request-response ask.
  - on: gh.review_requested
    filters:
      reviewer: { logins: [your-login] }
      exclude: { branches: ["release/*"], labels: [hold] }
    steps:
      - { id: a, workflow: assess-and-post, with: { repo: "{{.repo}}", pr: "{{.pr}}" } }
      - id: draft
        if: "{{.a.decision}} == auto"
        type: agent
        agent: planner
        checkout: none
        prompt: "Draft the review for {{.repo}}#{{.pr}}."
      - id: review
        if: "{{.a.decision}} == auto"
        uses: hoff.ask
        options: { prompt: "Submit this review for {{.repo}}#{{.pr}}?", draft: "{{.draft.text}}", timeout: 2h }
      - id: submit
        if: "{{.review.action}} == approve"
        uses: gh.submit_review
        options: { repo: "{{.repo}}", pr: "{{.pr}}", event: COMMENT, body: "{{.review.text}}" }
    policy:
      quiet_hours: { hold: false } # this workflow ignores the global quiet hours

  # Inline code between services: reshape an alarm, page or post accordingly.
  - on: hooks.cloudwatch
    steps:
      - id: shape
        run: js # QuickJS in-process (wazero); go-embed | go | sh | node | … also work
        code: |
          return { sev: ctx.body.detail.severity || "low",
                   name: ctx.body.detail.alarmName };
      - id: page
        if: "{{.shape.sev}} == high"
        uses: slack-ops.post
        options: { text: "ALARM {{.shape.name}} (high) — {{.url}}" }
      - id: log
        if: "{{.shape.sev}} != high"
        uses: slack-ops.post
        options: { text: "alarm {{.shape.name}} ({{.shape.sev}})" }

  # Scheduled work; a command step's stdout becomes its outputs.
  - on: timer.nightly-tidy
    steps:
      - { id: tidy, type: command, command: [make, tidy], workdir: ~/src/infra }
      # - { id: remote, run: sh, host: build-box, code: "make deploy" }

  # Post release notes to Slack — a cross-boundary one-liner.
  - on: gh.release
    filters: { include_prereleases: false }
    steps:
      - { id: announce, uses: slack-ops.post, options: { text: "released {{.tag_name}}: {{.url}}" } }

# ---------------------------------------------------------------------------
# policy: — cross-cutting controls. This block is valid at three scopes —
# here (global), on a connector, and on a trigger — most specific wins.
# ---------------------------------------------------------------------------
policy:
  quiet_hours: { tz: America/Denver, from: "22:00", to: "07:00", hold: true }
  concurrency: { max_agents: 3, max_agents_per_hour: 40 }
  # pause_label: "conductor:off"
  # shadow: true              # preview everything, dispatch nothing
  # (there is no config kill switch — pause the whole daemon with
  #  `conductor pause` / `resume`; disable one connector or trigger in place
  #  with its own `enabled: false`)

# Conductor's own lifecycle is a built-in source: alerting is an ordinary
# trigger on conductor.* — dispatch, escalate (gave up after retries),
# needs_input, complete, failed (a run errored), updated, update_available.
# Context: {{.message}} (the composed line) + event/ref/repo/number/
# origin_kind/title (the update events add {{.version}}). Routing, per-event
# fan-out (on: lists), quiet hours (policy:), and digests (group: window)
# all come from the normal trigger grammar. The retired notify: block
# auto-migrates to these triggers. A loop guard keeps a lifecycle trigger's
# own run from re-feeding conductor.* (no notify storms);
# escalate/needs_input/complete stay audit-logged for status/report even
# with no trigger configured.
#
# triggers:
#   - name: alert
#     on: [ conductor.escalate, conductor.failed, conductor.needs_input ]
#     steps:
#       - { uses: slack-ops.post, options: { text: "conductor {{.message}}" } }
#   - name: daily-digest
#     on: conductor.complete
#     group: { key: '"digest"', window: 24h }
#     steps:
#       - { uses: slack-ops.post, options: { text: "[digest] {{ len .group.events }} completed run(s) today" } }
#
# conductor also exposes VERBS on itself — uses: conductor.update | pause |
# resume | restart | reload | run {name, inputs}; gh.sweep runs the github
# catch-up now. Gate the self-update as a workflow:
#
# update: { auto: true, apply: workflow }   # detection EMITS conductor.update_available
# triggers:
#   - name: gated-update
#     on: conductor.update_available
#     steps:
#       - { uses: build-box.run, options: { command: "drain.sh" } }
#       - uses: conductor.update              # download + apply + restart
#         hooks:
#           - { at: start, uses: slack-ops.post, options: { text: "updating conductor → {{.version}}" } }
#           - { at: fail,  uses: slack-ops.post, options: { text: "conductor update FAILED: {{.error}}" } }
#       - { uses: build-box.run, options: { command: "smoke-test.sh" } }

update: { auto: true } # self-update (auto-applies by default); auto-migration runs on the new binary's first boot
# store:
#   state_file: ~/.local/state/conductor/state.json
#   audit_log:  ~/.local/state/conductor/audit.jsonl
# dry_run: false
