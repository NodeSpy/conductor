# conductor — example configuration (connectors model).
#
# Connect to services once (connectors:), declare where agents run (runtimes:)
# and which models they may use (models:), then wire events to work
# (triggers:). Behavior lives on the step that dispatches it, shared through
# named templates in steps: — there is no `agents:` block. A trigger
# is four keys — on / filters / steps / hooks — and a step can run an agent,
# run a command, run inline code, call any connector's verb, or call a
# reusable workflow. Everything here is optional except at least one trigger
# (or a legacy integrations: block — the previous schema still loads, and
# `conductor config migrate` converts it; see config.example.legacy.yaml).
#
# Secrets: ${VAR} / env:VAR reads the environment / the sibling conductor.env
# — the implicit baseline, nothing to declare. Everything beyond env is a
# vault declared in vaults: (below) and read with
# {{ vault "<name>" "<key>" }}. `conductor secrets check` unlocks every
# vault and resolves every reference without printing values.

# ---------------------------------------------------------------------------
# vaults: — named secret stores. Types: conductor (the built-in hardened
# encrypted vault.json — entry names and count are inside the ciphertext),
# onepassword (op CLI, read-only), pass (GPG store), file (a mounted dir of
# secret files, read-only), hashicorp (HashiCorp Vault KV v2). Each entry
# carries its connection + an unlock: bootstrap ref (env:VAR, file:/path,
# keyring:, creds: for systemd credentials — non-interactive, because the
# daemon restarts itself). Steps read/write with `uses: <name>.read` /
# `<name>.write` (write only on writable types); values are tainted and
# redacted from logs/audit. CLI: conductor vault <name> init|add|get|ls|rm.
# ---------------------------------------------------------------------------
# vaults:
#   house: { type: conductor }                  # ~/.config/conductor/vault.json
#   op:    { type: onepassword, account: acme, service_account: env:OP_SA }
#   store: { type: pass, prefix: conductor }
#   files: { type: file, dir: /run/secrets }
#   hcv:   { type: hashicorp, addr: https://vault.internal, unlock: { token: env:VAULT_TOKEN } }

# ---------------------------------------------------------------------------
# connectors: — external services. Each has two faces: events you can trigger
# on (`on: <name>.<event>`) and verbs you can call (`uses: <name>.<verb>`).
# `conductor connectors ls` lists them; `conductor schema <name>` prints every
# event's filters/context and every verb's options/outputs.
#
# Any section splits across files — `imports:` (plural) lists files/globs,
# `import:` (singular) loads one file. A map section takes an `imports:` key
# (entries merge; a duplicate name across files is a load error); a named
# entry loads its body from a file (`pd: { import: ./conf.d/pd.yaml }`); the
# triggers: list takes the same plural key as items (`- imports: [globs]`). A step pulls one workflow straight
# from a file: `workflow: name, import: ./workflows/review.yaml`, or a bare
# `workflow: ./workflows/review.yaml` when the file defines a single workflow.
# ---------------------------------------------------------------------------
connectors:
  # imports: [conf.d/connectors/*.yaml]   # split entries across files
  gh:
    use: github
    # Credentials resolve app → token → the gh CLI (`gh auth token`). With an
    # App you get webhook installs + a separate read-rate pool; without one, a
    # plain webhook (+ secret) or the sweep delivers events and a PAT (or your
    # gh login) covers reads. Repo globs in sweeps need an App.
    app:
      app_id: 123456
      private_key_path: ~/.config/conductor/github-app.pem
      webhook_secret: ${GH_WEBHOOK_SECRET}
    # token: ${GH_PAT}                  # the App-less alternative
    webhook:
      smee_url: ${GH_SMEE_URL} # and/or a direct listener:
      # listen: "127.0.0.1:8787"
      # path: /webhook
    sweep: { enabled: true, repos: ["your-org/*"] }
    me: { logins: [your-login] } # defines "you" (your PRs, your reviews)
    repos: ["your-org/*"] # default repo scope for triggers with no repos filter
    identity: { read_token: app, write_token: gh_auth, commit_author: self }
    # Default verb options: every gh verb call merges over these (call wins).
    # `as: me` posts as you; `as: bot` (per call or here) posts as the App.
    options: { as: me }
    policy:
      ignore: { users: ["dependabot[bot]", your-login] }
      pause_label: "conductor:hold" # label that parks a PR/issue
      rate_limits: { per_minute: 60 } # outbound verb cap
      backoff: { base: 10s, max: 30m } # retry cadence past the attempt threshold
      # reply_to_bots: decline_only  # bot-authored comments: decline_only (default) | off | full

  slack-ops:
    use: slack
    app_token: ${SLACK_APP_TOKEN} # Socket Mode (events in)
    bot_token: ${SLACK_BOT_TOKEN} # posting (verbs out)
    options: { channel: C0123456789 } # default channel for post/ask

  # An ask-capable web page (approve / revise / discard) served on the inbound
  # listener — `uses: hoff.ask` presents a draft there and waits.
  hoff:
    use: web
    base_url: https://conductor.example.com
    listen: ":8099"
    ttl: 30m
    # tunnel: { provider: cloudflared }   # or lan|ngrok|tailscale|ssh|command

  # discord-ops:
  #   type: discord
  #   bot_token: ${DISCORD_BOT_TOKEN}
  #   options: { to: dm, user: "189..." }

  # A command connector: `uses: build-box.run` executes a command — on the
  # named hosts: entry over SSH, or locally when host:/ssh: is absent.
  # Outputs: stdout, stderr, exit_code (a non-zero exit is data, not an error).
  # build-box:
  #   type: command
  #   host: build-box            # a hosts: entry; or inline ssh: {host: …}
  #   cwd: /srv/build
  #   env: { CI: "1" }

  timer:
    use: cron
    schedules:
      nightly-tidy: { cron: "0 4 * * *" }
      weekly-audit: { cron: "0 5 * * 0" }
      rate-check: { every: 6h, run_on_start: true }

  hooks:
    use: webhook
    listen: ":8099" # shared with other listeners on the same address
    sources:
      cloudwatch:
        path: /hooks/cloudwatch
        sign: { header: X-Signature-256, secret: ${CW_SECRET}, scheme: sha256 }
        match: '{{if eq .body.detail.state "ALARM"}}true{{end}}'
        title: "{{.body.detail.alarmName}}"
        dedup: "{{.body.detail.alarmName}}-{{.body.time}}"

  # sentry and pagerduty are NOT bundled — they are plugins from the official
  # repo (github.com/NodeSpy/conductor-plugins). There is nothing extra to
  # declare: the bare name in `use:` IS the declaration. `conductor init`
  # fetches, checksum-verifies, and installs the binary; it then stays current
  # unless you pin an exact version (use: sentry@v1.2.3).
  #
  # Filters use the plugin's own vocabulary and steps template its flat context
  # keys ({{.level}}, {{.short_id}}, …), not the old nested {{.sentry.*}}.
  #
  # sentry-prod:
  #   use: sentry
  #   listen: ":8098"
  #   client_secret: ${SENTRY_CLIENT_SECRET}
  # pd:
  #   use: pagerduty
  #   listen: ":8097"
  #   signing_secret: ${PAGERDUTY_SIGNING_SECRET}
  # upstream:
  #   type: rss
  #   feeds:
  #     changelog: { url: https://example.com/releases.atom, interval: 30m }

  # type: rest — any HTTP API, declared entirely in config. You declare the
  # verbs (method + templated path/query/headers/body, `expect:` success
  # statuses defaulting to 2xx, `output:` templates over the parsed response)
  # and optionally polled `events:` (a request, a `list:` template naming the
  # response array, an `id:` template for dedup, `context:` fields published
  # to the trigger). Templates see {{.options.*}}, {{ vault … }} reads, and — in
  # outputs — {{.response.status/body/headers}}; events add {{.item.*}}. The
  # `json` filter encodes a structured option as a JSON body.
  # auth: is shared with graphql: none | bearer{token} | basic{username,
  # password} | header{name,value} | oauth2{grant, token_url, client_id,
  # client_secret, token_vault, scopes, auth_url, device_auth_url,
  # redirect_uri}. oauth2 grants: client_credentials | refresh_token |
  # authorization_code | device. Tokens are fetched and cached per connector,
  # refreshed ahead of expiry and once on a 401; the captured access +
  # refresh tokens live in token_vault (a vaults: entry) and rotations are
  # written back there. Log in once with `conductor connector auth <name>`;
  # `connector auth ls` shows each connector's state + expiry.
  # xero:
  #   type: rest
  #   base_url: https://api.xero.com/api.xro/2.0
  #   auth:
  #     type: oauth2
  #     grant: refresh_token
  #     token_url: https://identity.xero.com/connect/token
  #     auth_url: https://login.xero.com/identity/connect/authorize
  #     client_id: ${XERO_CLIENT_ID}
  #     client_secret: '{{ vault "house" "xero-client-secret" }}'
  #     token_vault: house                     # captured tokens + rotations persist here
  #     scopes: [accounting.transactions, offline_access]
  #   headers: { Accept: application/json, Xero-Tenant-Id: "${XERO_TENANT_ID}" }
  #   verbs:
  #     list_invoices:
  #       method: GET
  #       path: /Invoices
  #       query: { where: 'Contact.ContactID==Guid("{{.options.contact}}")' }
  #       output: { invoices: "{{.response.body.Invoices}}" }
  #     create_invoice:
  #       method: POST
  #       path: /Invoices
  #       body: "{{ .options.invoice | json }}"
  #       output: { id: "{{ (index .response.body.Invoices 0).InvoiceID }}" }
  #   events:
  #     new_invoice:
  #       poll: 10m
  #       request: { path: /Invoices, query: { order: "UpdatedDateUTC DESC" } }
  #       list: "{{.response.body.Invoices}}"
  #       id: "{{.item.InvoiceID}}"
  #       context: { title: "invoice {{.item.InvoiceNumber}}", total: "{{.item.Total}}" }

  # type: graphql — one endpoint, verbs are named queries/mutations with
  # templated variables:. Variables keep their types (a sole {{.path}} stays
  # a list/map/number). The request is POST {query, variables}; a non-empty
  # errors array fails the verb even on HTTP 200; output: templates read
  # {{.response.data.*}}.
  # shop:
  #   type: graphql
  #   endpoint: https://myshop.myshopify.com/admin/api/2025-01/graphql.json
  #   auth: { type: header, name: X-Shopify-Access-Token, value: '{{ vault "house" "shopify-token" }}' }
  #   verbs:
  #     create_order:
  #       query: |
  #         mutation($id: ID!, $lines: [OrderLineInput!]!) {
  #           orderCreate(customerId: $id, lines: $lines) { order { id name } }
  #         }
  #       variables: { id: "{{.options.customer}}", lines: "{{.options.lines}}" }
  #       output: { order_id: "{{.response.data.orderCreate.order.id}}" }

# ---------------------------------------------------------------------------
# hosts: — named SSH targets. Reference one with `host:` from a code step, a
# command step, an agent profile, or a cli/acp runtime; conductor runs the
# work there via the system ssh (key auth + known_hosts, BatchMode).
# A host may carry isolation: (modes user/namespace) — every script it runs,
# including policy.agent_authored.host sandbox code, executes de-privileged
# on the remote box. See the Isolation wiki page.
# ---------------------------------------------------------------------------
hosts:
  build-box: { host: build01.internal, user: ci, key: ~/.ssh/id_ed25519 }
  # sandbox:
  #   host: sandbox.internal
  #   user: ci
  #   isolation: { mode: user, user: agents }   # sudo -n -u agents on the box

# ---------------------------------------------------------------------------
# isolation: — per-dispatch sandboxing (#36 §15) for the runtimes conductor
# launches ITSELF (acp / cli / opencode / agent-deck — not paseo: its agents
# are the paseo daemon's children, and validate rejects the combination).
# Settable on a runtime (all its launches) or an agent profile (wins).
#
#   mode: user       — run as a low-privilege user (sudo -n -u <user>);
#                      any Unix with the sudoers rule.
#   mode: namespace  — Linux user/pid/mount namespaces (unshare), cgroup
#                      limits: via systemd-run; network: {deny: true} adds
#                      a network namespace (structurally no network). The
#                      daemon's state/config dirs are MASKED from the mount
#                      view by default; privileged: true is the opt-out.
#                      As ROOT (euid 0) the user namespace maps root→root and is
#                      NOT a privilege boundary, so conductor REFUSES namespace
#                      mode as root — run a non-root daemon or mode: container.
#                      allow_root: true forces it anyway (cleanup/limits only,
#                      never a security wall).
#   mode: container  — docker/podman run with the worktree bind-mounted;
#                      deny: true → --network=none.
#
# network.egress routes the runtime's HTTP(S) traffic through conductor's
# filtering proxy (per-dispatch credential required): listed "host:port" /
# "*.glob:port" targets pass, everything else is 403'd + audited (event:
# egress_denied). A bare "host" means :443 only; "host:*" is the any-port
# opt-in. An empty network: {} is deny-all. Under mode user the allowlist is
# ADVISORY (proxy env only — validate warns); deny: true PLUS egress: under
# namespace/container is the ENFORCED allowlist: no network at all except a
# forwarder into the proxy. Agent-authored dispatches (§11 plans) get the
# deny-all proxy BY DEFAULT, with or without an isolation: block — an
# explicit egress: list on the profile opts targets back in.
# ---------------------------------------------------------------------------
# runtimes:
#   gemini:
#     agent: gemini                        # acp transport — conductor launches it
#     isolation:
#       mode: namespace
#       limits: { memory: 2g, cpu: 200%, pids: 256 }
#       network: { egress: [ "api.github.com:443", "*.googleapis.com:443" ] }
# steps:
#   risky-fixer:
#     type: agent
#     runtime: gemini
#     isolation:                           # step-level: wins over the runtime's
#       mode: user
#       user: sandboxagent
#       network: {}                        # deny-all egress, audited

# ---------------------------------------------------------------------------
# stores: — named data stores in two families. KV types (boltdb/redis/http)
# are served by the kv.* verbs; SQL types (postgres/mysql/sqlite, pure-Go
# drivers) by sql.query/sql.exec. Every store is explicit (no defaults); a
# data verb picks one with its required `store:` option, and the family is
# checked at load. boltdb = one pure-Go file per store (path:, or
# <data dir>/<name>.db); redis maps to native ops with Lua-scripted
# read-modify-writes; http is a generic REST shim (POST base_url, one JSON
# op per request — the shim owns RMW atomicity) reusing the rest auth block.
# SQL stores run statements against your existing schema (conductor manages
# no migrations); statements are parameterized only — values bind through
# args: to driver placeholders ($1 postgres, ? mysql/sqlite), never into
# the sql text.
# ---------------------------------------------------------------------------
# stores:
#   state: { type: boltdb }                    # <data dir>/state.db
#   archive: { type: boltdb, path: /mnt/big/archive.db }
#   cache: { type: redis, url: "redis://10.0.0.5:6379/0", password: '{{ vault "house" "redis_pw" }}' }
#   shared:
#     type: http
#     base_url: https://kv.example.com/kv
#     auth: { type: bearer, token: '{{ vault "house" "kv-shim" }}' }
#   analytics: { type: postgres, url: "postgres://conductor@db/analytics", password: '{{ vault "house" "pg" }}' }
#   billing: { type: mysql, dsn: "conductor:@tcp(db:3306)/billing", password: '{{ vault "house" "mysql" }}' }
#   local: { type: sqlite }                    # <data dir>/local.sqlite

# ---------------------------------------------------------------------------
# memory: — durable memory agents share across runs (what one agent learns is
# available to the next). Entries carry provenance {agent, run, trigger,
# repo} and a scope (global / repo:<owner/repo> / agent:<name>). Pick exactly
# one backend, no default: store: reuses a stores: KV entry (redis/http →
# fleet-shared); dir: keeps one hand-editable Markdown-with-frontmatter file
# per memory; type: memory is ephemeral in-process. Verbs: memory.remember /
# recall / forget / list (always-on, audited). Agents write back via a
# ```remember block in their final output (any runtime) or a live MCP tool
# (ACP runtimes); a profile opts into prompt injection with memory: true.
# ---------------------------------------------------------------------------
# memory:
#   store: state                          # or dir: ~/.config/conductor/memory
#   # or type: memory                     # ephemeral, gone on restart

# ---------------------------------------------------------------------------
# policy.agent_authored — agent-driven workflows (OFF until this block
# exists). An agent may emit a plan: of ordinary steps (validated + guarded
# structurally before anything runs), choose a workflow from the
# workflow.list catalog, and promote patterns with workflow.save (reviewed
# via `conductor workflows review` before unattended reuse). allow: admits
# step classes freely; approve: needs a dry-run + hand-off approval on
# approve_via; host: is the sandbox agent code/cli is FORCED onto; limits
# bound size/time/tokens; no_secret_egress gates the read-secret+write-out
# combo; trust: full is the deliberate lift-everything opt-in.
# ---------------------------------------------------------------------------
# policy:
#   agent_authored:
#     allow:   [ kv.*, memory.*, workflow, "workflow.*", gh.comment ]
#     approve: [ cli, code, gh.merge ]
#     approve_via: slack-ops
#     allow_secrets: [ house/deploy_key ]  # secrets an agent-authored step may reference (deny-by-default;
#     allow_stores:  [ cache ]             #   "*" = all of a kind; trust: full lifts all three lists)
#     allow_targets: [ your-org/* ]        # repos beyond the TRIGGERING one (implicitly allowed)
#     host: sandbox                      # a hosts: entry
#     identity: bot
#     limits: { max_steps: 50, max_fan_out: 20, max_sub_agents: 5, timeout: 30m, tokens: 200k }
#     max_revisions: 3
#     no_secret_egress: true

# ---------------------------------------------------------------------------
# policy.budget — hard $/token spend caps over a rolling window (#36 §14).
# Three scopes: global (here), per profile (agents.<name>.budget), and per
# workflow (a trigger-level policy.budget). Every governing scope must be
# under cap; an over-cap dispatch SHEDS like the agents-per-hour budget
# (attempt recorded, retried when the window frees) and notifies. Usage is
# runtime-reported where the output carries it, else estimated from model +
# I/O and marked approximate. See `conductor report` for the spend view.
# ---------------------------------------------------------------------------
# A budget caps EXECUTION COST on a backend, so the middle scope is the
# RUNTIME (it used to be a per-agent profile). Spend is tracked and reported
# per runtime.
#
# policy:
#   budget: { window: 24h, max_cost_usd: 25 }        # global: $25 / rolling 24h
# runtimes:
#   gpu-paseo:
#     budget: { window: 1h, max_tokens: 500k }       # this backend's own cap
# triggers:
#   - on: gh.review_requested
#     policy:
#       budget: { max_cost_usd: 5 }                  # workflow scope (24h default)

# pricing: — override the built-in model→$ table estimation uses.
# pricing:
#   models:
#     "claude-opus-*": { input: 15.00, output: 75.00 }   # $ per 1M tokens
#   default: { input: 3.00, output: 15.00 }

# ---------------------------------------------------------------------------
# checks: + gate: — quality gates on agent output (#36 §16). A gate runs
# named checks against the agent's PROPOSED change (in its worktree) before
# the step's result promotes: all pass → promote; a failure loops the detail
# back to the SAME agent as a revise follow-up (bounded by max_revisions);
# exhausted → escalate (needs_input) and the step fails. Checks are ordinary
# steps (command / code / verb / critic agent): a step error or `pass: false`
# output is a fail; a critic MUST output pass: true|false. gate: sits on an
# agent step, or on a trigger/workflow as the default for its agent steps.
# Checks see {{.gate.workdir}} / {{.gate.attempt}} / {{.gate.output}}.
# ---------------------------------------------------------------------------
# checks:
#   test: { type: command, command: ["make", "test"] }        # exit 0 = pass
#   lint: { run: sh, code: "golangci-lint run ./..." }
#   critic:
#     type: agent
#     agent: reviewer
#     prompt: "Review the change in {{.gate.workdir}}; output {\"pass\": bool, \"reason\": \"…\"}"
#     output_schema: { type: object, required: [pass], properties: { pass: { type: boolean } } }
# triggers:
#   - on: gh.review_requested
#     steps:
#       - { id: fix, type: agent, step: fixer, prompt: "…",
#           gate: { run: [ test, lint, critic ], max_revisions: 2 } }

# ---------------------------------------------------------------------------
# The outcome loop (#36 §18) runs by itself: merged / closed / reverted /
# approved / rejected / ci_failed outcomes are captured per agent action
# (github's _closed signal needs no trigger config), audited, and fed into
# memory + saved-workflow delivery health. `conductor report` shows accept
# rate / revert rate / $-per-merged-change per TRACK-RECORD KEY, which
# defaults to the step identity. Optional per-step guidance tuning:
# ---------------------------------------------------------------------------
# steps:
#   fixer:
#     type: agent
#     outcome_feedback: true    # append this step's own track record to its prompt
#     # outcome_key: reviewers  # …or pool several steps onto one record

# ---------------------------------------------------------------------------
# team: — multi-agent on ONE task (#36 §19): a planner decomposes the step's
# prompt into subtasks (schema-enforced), workers run them in parallel
# isolated worktrees (their profiles' isolation: applies), a critic judges
# each result through the gate machinery (revise loop included), and a
# reconciler (default: the planner) merges. Distinct from for_each/parallel.
# The step's own gate: checks the reconciler's merged change.
# ---------------------------------------------------------------------------
# triggers:
#   - on: gh.issue_matched
#     filters: { labels_any: [epic] }
#     steps:
#       - id: feature
#         prompt: "Implement the feature described in {{.url}}"
#         team:
#           planner: architect
#           worker: implementer
#           critic: reviewer          # optional judge per worker
#           reconcile: architect      # optional; defaults to the planner
#           max_workers: 4            # subtask cap AND parallelism (1..16)
#           gate: { run: [ test ] }   # optional explicit checks per worker

# ---------------------------------------------------------------------------
# runtimes: — where agents run (previously controllers:). The paseo runtime's
# bin: replaces the old top-level paseo_bin. Any runtime may set host: to run
# on a hosts: entry over SSH — a remote paseo runs its whole CLI there (put
# its environment on the host entry's env:), an opencode server is reached
# through an ssh -W forward, cli/acp/agent-deck wrap their launch.
#
# THREE SHAPES. The common case is one word — a runtime's NAME implies its
# `use:` reference, so you only write use: when the name differs from the
# implementation (or points at a plugin repo / URL / local path):
#
#   runtimes: paseo                 # scalar: one runtime, nothing to configure
#   runtimes: [paseo, claude]       # list:   several
#   runtimes:                       # map:    named, with config (below)
#
# MODELS. The optional models: block on a runtime says which model it passes
# by default, how it ranks a choice, and what it may ever run. Omit it and the
# runtime is fully automatic: its roster is discovered (see the
# model-discovery wiki page), its default is a BARE LAUNCH, nothing is
# restricted.
#
#   default:  the model to pass when nothing else resolves one. Its ABSENCE is
#             meaningful — no default means bare launch (no --model at all,
#             the runtime uses its own built-in default).
#   prefer:   ranking among acceptable models; the consumer disposes.
#   allow:    what this runtime may EVER run; the roster is filtered to it.
# ---------------------------------------------------------------------------
runtimes:
  paseo:
    use: paseo
    bin: paseo
    default: true
    # models:
    #   default: claude-opus-5                  # omit -> bare launch
    #   prefer:  [claude-opus-5, gpt-5.6-sol]   # ranking when a fleet offers a choice
    #   allow:   ["claude-opus-*", "gpt-5.6-*"] # a hard ceiling on what may run
  gpu-paseo: { use: paseo, bin: /usr/local/bin/paseo, host: build-box }
  # deck:   { use: agent-deck }
  # gemini: { use: acp, agent: gemini }              # ACP transport
  # remote: { use: cli, tool: claude-code, host: build-box }

# ---------------------------------------------------------------------------
# models: — named FLEETS (the spot-fleet model). A fleet is a ranked list of
# ACCEPTABLE models plus a fallback posture, so a step (or a pack you install)
# says what it NEEDS rather than hardcoding a model you may not have.
#
#   any:      acceptable, best-first. Literals and wildcards.
#   required: true  -> nothing available is a HARD ERROR (don't quietly
#                      downgrade a reviewer)
#             false -> nothing available falls through to a bare launch
#
# WILDCARDS are globbed against the DISCOVERED roster, so one never conjures a
# model you cannot run. Literals keep their listed priority; a wildcard
# expands in place, newest-first, de-duped against literals already listed.
#
# YAML GOTCHA: a pattern that STARTS with * must be QUOTED — a bare * is a
# YAML alias indicator. Quote "*", "*-mini", "*pro*".
# ---------------------------------------------------------------------------
models:
  reviewer:
    any: ["claude-opus-*", "gpt-5.6-*", "gemini-3.*-pro"]
    # required: true      # uncomment to refuse to run at all rather than downgrade
  summarizer:
    any: ["claude-haiku-*", "*-mini", "gemini-2.5-flash*"]

#
# A step then names one — model: accepts a string, an array, or an object:
#
#   steps:
#     - { id: architecture, type: agent, model: reviewer }               # a fleet
#     - { id: security,     type: agent, model: ["claude-opus-*"] }      # inline fleet
#     - { id: audit,        type: agent, model: { any: ["claude-opus-*"], required: true } }
#     - { id: summarize,    type: agent, model: gemini-2.5-flash }       # exact pin
#     - { id: lint,         type: agent, model: "*" }                    # any, honoring prefer
#
# A bare string is MAP-KEY-WINS: it is a fleet reference if it names a key in
# models:, otherwise a model id or a wildcard.
#
# `model: "*"` and NO model: are different outcomes. `"*"` resolves to a
# concrete model through prefer:; omitting model: entirely is a bare launch.

# ---------------------------------------------------------------------------
# use: — ONE field names what implements a connector or a runtime. There is no
# separate plugins: block: the reference IS the declaration, the way adding a
# browser extension is one action, not two.
#
# Resolution (first match wins, and the KIND comes from the block you wrote it
# in — a connector can never be wired as a runtime):
#
#   use: github                    a BUILTIN (compiled in; `conductor plugin list`)
#   use: sentry                    not builtin -> the OFFICIAL plugin repo,
#                                  github.com/NodeSpy/conductor-plugins, at
#                                  connectors/sentry (runtimes/<name> under runtimes:)
#   use: acme/plugins/jira         an explicit github repo (github.com implied)
#   use: git.corp.example/t/p//x   an explicit non-github host
#   use: ./bin/conductor-jira      a local binary, for developing one
#
# `conductor init` installs everything referenced. Install state is LOCAL — it
# lives in the state dir, NOT in a committed lockfile: which build is on this
# box is a property of this box. Boot reads it offline; a plugin that cannot be
# reached keeps running the build already installed.
#
# By default a plugin STAYS CURRENT and every update is logged with the sha it
# moved from. Pin an exact build to opt out: use: sentry@v1.2.3 (a RANGE such as
# @^1.2 still tracks). The official repo is trusted by default; a third-party
# repo needs a plugin_trust entry.
# ---------------------------------------------------------------------------
# connectors:
#   tickets:
#     use: acme/plugins/jira                # explicit repo, tracks latest 1.x…
#     # use: acme/plugins/jira@^1.2         # …or constrain it
#     # use: acme/plugins/jira@v1.2.3       # …or pin it exactly (no auto-update)
#     api_key: ${JIRA_TOKEN}
#     network: ["your-org.atlassian.net:443"]   # NARROWS the plugin's declared
#                                               # egress; it can never widen it
#   linear:
#     use: linear                           # bare name -> the official repo
#     api_key: ${LINEAR_KEY}
# runtimes:
#   modal: { use: modal }                   # a runtime plugin, co-equal with paseo
# steps:
#   deployer: { type: agent, runtime: modal }   # then select it here
#
# plugin_trust: { allow: [github.com/acme/*] }   # third-party sources need an
#                                                # entry; the official repo does not
#
# SECURITY. A plugin declares the hosts it calls and the commands it spawns.
# Conductor records that manifest when it installs the plugin, SHOWS it to you
# (`conductor plugin add`, `plugin list --caps`, `plugin show`), and confines
# the subprocess to it. That is a visible permission manifest, not an OS jail —
# conductor is a privileged app you chose to run, and so is a plugin you added.
# OS isolation is still there, as OPT-IN hardening for a locked-down box:
#
# connectors:
#   tickets:
#     use: acme/plugins/jira
#     isolation: { mode: namespace, network: { egress: ["your-org.atlassian.net:443"] } }

# ---------------------------------------------------------------------------
# steps: — NAMED, REUSABLE STEP TEMPLATES. This replaced `agents:`.
#
# A named agent profile was doing five different jobs. Each now has a home
# that is not an agent (docs/design/agents-removal.md):
#
#   which model to run   -> model: (a fleet, above) on the step
#   execution cost cap   -> budget: on the RUNTIME (a budget caps cost on a backend)
#   private memory       -> an opaque scope key, defaulting to the step identity
#   live-session pool    -> (runtime, model, key) — session: on the runtime or the step
#   track record         -> an opaque outcome key, defaulting to the step identity
#   behavior             -> the step itself, shared via a YAML anchor
#
# STEP IDENTITY is the one key memory, sessions, and outcomes all default to.
# It is stable across restarts (never a per-run value):
#
#   1. an explicit `name:`  — author-pinned, and SHAREABLE: two steps with the
#      same name share one memory namespace, session pool, and track record
#   2. structural — the enclosing trigger/workflow + the step's slot
#      (`github.pull_request/security`); editing a prompt does not rotate it
#   3. a deterministic fingerprint of the step's definition
#
# SHARING CONFIG between steps is a different thing from sharing identity,
# and it is plain YAML — an anchor, the same mechanism docker-compose uses.
# Park the anchors under any top-level `x-` key (the loader ignores those)
# and merge one in with `<<:`:
#
#   x-templates:
#     base: &base
#       type: agent
#       workspace: worktree
#   triggers:
#     - on: gh.review_requested
#       steps:
#         - <<: *base           # merge the base…
#           id: fix             # …then this step's own fields (they win)
#           prompt: "Fix CI."
#
# Two caveats worth knowing up front:
#   * anchors are FILE-LOCAL — they do not cross `imports:`. For reuse across
#     files, use `extends:` on a map section (runtimes/workflows/handoffs) or
#     a named step below.
#   * an anchor copies FIELDS, not identity. Two steps merging one anchor are
#     still two identities. `name:` is the separate, deliberate opt-in to
#     sharing one.
#
# The `steps:` map below is NOT that mechanism. It is a REGISTRY of named
# steps other config addresses BY NAME — a `team:` role, or a pack role a
# consumer rebinds. A step plays one with `step: <name>` and takes its
# behavior AND its name, which is exactly what `agent: fixer` used to give.
# ---------------------------------------------------------------------------
steps:
  fixer:
    type: agent
    model: claude-sonnet-5  # a fleet name, a model id, a wildcard, or { any, required }
    workspace: worktree
    wait_timeout: 25m
    archive_when_done: true
    # guidance: "Reply in a sentence or two."  # STACKS on policy.guidance (layer 0);
    #                       #   a list or { replace: … } is also accepted (wiki: Reuse)
    # runtime: paseo        # explicit runtime (default: the default: true one)
    # host: build-box       # pin this step's runtime launches to a host
    # memory: true          # inject shared memories — the shared set plus this run's
    #                       #   context keys (the repo, the workflow, this step). Scope
    #                       #   keys are OPAQUE strings; there are no repo/agent TYPES:
    #                       #   memory: { scopes: ["${repo}", "acme/api"], tags: [ci], limit: 10 }
    # outcome_feedback: true # append this step's own track record to its prompt
    # outcome_key: reviewers #   …or pool several steps onto one record
    # skill:                 # agent access back into conductor (default: none of it)
    #   secrets_via: broker  #   broker | env (deprecated) | none (default) — broker issues
    #   allow_secrets:       #   single-use, 60s-TTL, audited grants for EXACT vault entries
    #     - house/deploy_key #   (<vault>/<key> — the entries {{ vault "house" "deploy_key" }} reads)
    #   verbs: [gh.comment, rest.*]  # THE GRANT — deny-by-default. Forms:
    #                       #     ["*"]  all verbs, all connectors
    #                       #     [gh.*] all verbs of one connector
    #                       #     [gh.*, sentry.*] / [gh.comment] — several / specific
    #                       #   Reads are NOT open by default; breadth is an explicit
    #                       #   dial. conductor.*/workflow.* are unreachable at ANY
    #                       #   breadth (they go through run_step + agent_authored).
    #                       #   Conductor injects the matching verbs' options and call
    #                       #   form into the agent's prompt (the capability card), so
    #                       #   your prompt states INTENT — no `conductor call …` in it.
    #   max_calls: 100       #   per-session verb-call cap (default 256)
    #   # Identity is a per-verb concern, not a skill setting: a verb's own `as:`
    #   # option travels through as the agent supplies it, and each connector
    #   # applies its own default when it's absent (gh writes default to `me`).
    # session:               # THIS STEP'S OWN session pool, namespaced to its identity
    #   key: "{{.repo}}#{{.pr}}"  #   (a session: on the RUNTIME instead is the shared,
    #   idle_ttl: 12h             #    overall pool every step without one joins). A binding
    #   max_lifetime: 7d          #    is (runtime, model, key) — you cannot resume a paseo
    #   end_on: [ gh._closed ]    #    session on codex, nor an opus step into a haiku one.
  planner:
    type: agent
    model: claude-haiku-4-5
    archive_when_done: true

# ---------------------------------------------------------------------------
# workflows: — named, parameterized step lists with declared inputs/outputs,
# called from triggers via { workflow: <name>, with: {…} }.
# ---------------------------------------------------------------------------
workflows:
  assess-and-post:
    description: "triage a PR: agent decides auto vs manual, pings a channel when manual"
    inputs:
      repo: { type: string, required: true }
      pr: { type: integer, required: true }
      channel: { type: string, default: C0123456789 }
    outputs:
      decision: "{{.triage.decision}}"
    steps:
      - id: triage
        type: agent
        step: planner
        checkout: none
        output_schema:
          type: object
          required: [decision]
          properties: { decision: { enum: [auto, manual] } }
        prompt: "Assess {{.inputs.repo}}#{{.inputs.pr}}; decide auto vs manual."
      - id: ping
        if: "{{.triage.decision}} == manual"
        uses: slack-ops.post
        options: { channel: "{{.inputs.channel}}", text: "Needs a human: {{.inputs.repo}}#{{.inputs.pr}}" }

# ---------------------------------------------------------------------------
# triggers: — on / filters / steps / hooks (+ optional group / policy / name).
# Filters are AND-ed; their legal keys come from the event's schema. Steps see
# the trigger context plus every prior step's outputs; hooks see the same,
# scoped to when they fire (start: context only · done: + all outputs ·
# fail: + {{.error}}/{{.failed_step}}).
# ---------------------------------------------------------------------------
# ── Callable service (#36 §13) ────────────────────────────────────────────
# Conductor as a callable service: an external orchestrator (n8n, cron, a
# queue, plain curl, or an MCP client) fires a named workflow, passes inputs,
# and gets a structured result. The caller owns generic automation +
# scheduling; conductor owns agents-on-code. Vendor-neutral — n8n is just the
# first documented adapter.
#
# It dispatches agents, so it is gated like a control surface:
#   • authenticated — a bearer token OR an HMAC body signature per caller;
#   • deny-by-default scope — a token invokes only the workflows it lists;
#   • explicit opt-in — a trigger is reachable only with `callable: true`.
# All three gates must pass. Omit this block to leave the HTTP service off.
#
# The same callable workflows are also exposed as MCP tools for a local MCP
# client via `conductor mcp callable --token <name>` (a stdio server). By default
# that face is held to the SAME token model as the HTTP surface: it requires a
# --token, exposes only that token's workflows, and the daemon re-checks the
# callable opt-in + token scope and writes a callable_invoke audit for each call.
# Set `mcp_local: true` below to opt out (expose every callable workflow with no
# token and no audit, trusting the same-user control socket alone).
callable:
  # Bind for POST /invoke/<name> and GET /runs/<id>. Mounts on the shared
  # inbound listener, so it may reuse a `listen:` a webhook/sentry connector
  # already binds. Put it behind TLS / an internal network — the token is a
  # bearer secret.
  listen: ":8099"
  # Bounds a synchronous ?wait=true call (default 30s, hard-capped at 5m).
  wait_timeout: 30s
  # Concurrency ceilings (default 64 each): each synchronous wait and each
  # in-flight callback holds a goroutine up to 5m. A wait past the cap degrades
  # to async (202 + run_id); a callback past the cap is audited delivered:false.
  max_wait_inflight: 64
  max_callback_inflight: 64
  # SSRF fence for callback_url delivery. https-only by default, and any host
  # resolving into a private/LAN/loopback/CGNAT range is BLOCKED — so a
  # callback_url pointed at self-hosted n8n on your own network never arrives
  # unless you opt it in here. Set callback_allow_http for a plaintext sink, and
  # list its host below (a literal IP pins the exact address — rebinding-safe; a
  # hostname trusts it by name whatever it resolves to — for DHCP/Docker IPs).
  # callback_allow_http: false
  # callback_allow_hosts: []                 # e.g. [n8n.internal] or [10.0.0.9]
  # Clock-skew window for signed (HMAC) requests (default 5m). A request whose
  # signed timestamp is further from the server clock than this is refused.
  max_skew: 5m
  # `conductor mcp callable` token model. Default (false): the MCP face requires
  # --token and is scoped + audited like the HTTP surface. Set true to expose all
  # callable workflows over MCP with no token and no audit (same-user boundary only).
  # mcp_local: false
  tokens:
    # A bearer caller (n8n's "Header Auth" credential: Authorization: Bearer …).
    - name: n8n-prod
      bearer: "${CONDUCTOR_INVOKE_TOKEN}"   # from env/secrets — never inline
      workflows: [pr-summary]               # deny-by-default: only these
    # An HMAC caller: signs `timestamp\nMETHOD\npath\nbody` with HMAC-SHA256 and
    # presents the timestamp — replay-protected. Mutually exclusive with bearer.
    - name: ci-signer
      hmac:
        secret: "${CONDUCTOR_INVOKE_HMAC}"
        header: X-Conductor-Signature       # header carrying the signature
        scheme: hex                          # hex (default) | base64; "sha256=" prefix ok
        timestamp_header: X-Conductor-Timestamp  # header carrying the signed unix-seconds timestamp (default)
      workflows: [pr-summary]

# ---------------------------------------------------------------------------
# triggers: — the list form below, or a NAMED MAP where the key is each
# trigger's stable address. A key that reads as <source>.<event> also implies
# on:, which disambiguates across sources for free:
#
#   triggers:
#     github.pull_request:  { steps: [architecture, security] }
#     gitlab.merge_request: { steps: [architecture, security] }
#     pagerduty.incident:   { steps: [triage] }
#
# Two triggers on the SAME source.event just take free names and set on:
# explicitly — the key is the address, so it has to be unique:
#
#   triggers:
#     review:    { on: github.pull_request, steps: [...] }
#     autolabel: { on: github.pull_request, steps: [...] }
#
# A trigger's value is polymorphic: an object is ONE trigger, an ARRAY is
# several INSTANCES that each fire independently. There is no instances:
# keyword and no per-instance name — an instance's identity is its CONTENT
# (its repos/filters are what make it distinct), so its dedup state stays put
# when you reorder the list:
#
#   triggers:
#     review:
#       - { on: github.pull_request, filters: { repos: [me/app], labels: [ready] } }
#       - { on: github.pull_request, filters: { repos: [me/api] } }
# ---------------------------------------------------------------------------
triggers:
  # Near-identical triggers can share a base: a trigger `extends: <name>` inherits
  # another's steps/filters/policy (filters deep-merge, steps replace), and a base
  # marked `abstract: true` never fires and is stripped after resolution:
  #   - { name: review-base, abstract: true, steps: [ { id: r, type: agent, agent: reviewer, prompt: "Review {{.repo}}#{{.pr}}." } ] }
  #   - { on: gh.review_requested, extends: review-base, filters: { repos: [org/api] } }
  #   - { on: gh.review_requested, extends: review-base, filters: { repos: [org/web] } }
  # (wiki: Reuse)
  #
  # A callable manual workflow: reachable at POST /invoke/pr-summary for any
  # token scoped to it. `callable: true` is the trigger-side opt-in; without it
  # the workflow is invisible to the invoke surface even if a token lists it.
  - on: manual
    name: pr-summary
    callable: true
    steps:
      - id: audit
        type: agent
        step: fixer
        model: reviewer          # a fleet from models: — runs on whatever you have
        prompt: |
          Audit {{.repo}} for {{.scope}} and summarize findings.
          (inputs arrive under .inputs and at the top level)

  # Autonomous conflict fixer with Slack lifecycle hooks.
  - on: gh.merge_conflict
    steps:
      - id: fix
        type: agent
        step: fixer
        prompt: |
          {{.repo}}#{{.pr}} has a merge conflict against {{.base}}.
          Rebase or merge, resolve, verify the build, and push.
    hooks:
      - { at: start, uses: slack-ops.post, options: { text: "conflict on {{.repo}}#{{.pr}} — on it" } }
      - { at: done, uses: slack-ops.post, options: { text: "resolved {{.repo}}#{{.pr}}" } }
      - { at: fail, uses: slack-ops.post, options: { text: "couldn't fix {{.repo}}#{{.pr}}: {{.error}}" } }

  # A poster's comment burst becomes ONE run (debounce; window resets per
  # event, fires when quiet; at most one run per key is in flight).
  - on: gh.new_comment
    filters: { ignore_users: ["ci-bot"] }
    group: { key: "{{.repo}}#{{.pr}}", window: 15s }
    steps:
      - id: handle
        type: agent
        step: fixer
        prompt: |
          Address the review comments on {{.repo}}#{{.pr}}:
          {{range .group.events}}- {{.comment_body}}
          {{end}}
      - id: react
        uses: gh.comment
        options: { repo: "{{.repo}}", number: "{{.pr}}", body: "Addressed {{.group.count}} comment(s)." }

  # Multiple sources fan into one step list: a cron schedule, on-demand runs
  # (`conductor run repo-audit --input scope=all`), and a filtered GitHub
  # event. Each on: item is a bare conn.event or a one-key map whose value
  # is a per-source block: filters (validated against THAT source's schema
  # only; keys override the shared top-level filters:), policy (innermost
  # scope), hooks (appended after the shared hooks, for that source only).
  # Steps stay trigger-level. The trigger fires once per matching event from
  # any listed source; reference
  # source-specific fields defensively ({{.number | default ""}}). A trigger
  # reachable by `conductor run` requires a unique name:.
  - name: repo-audit
    on:
      - timer.weekly-audit
      - manual
      - gh.issue_matched:
          filters: { labels_any: [audit] }
          hooks:
            - { at: start, uses: gh.comment, options: { repo: "{{.repo}}", number: "{{.number}}", body: "auditing…" } }
    steps:
      - id: audit
        type: agent
        step: fixer
        prompt: |
          Run the repo audit pass (scope: {{ .inputs.scope | default "changed" }}).
          {{ if .number }}Triggered by issue #{{.number}}.{{ end }}

  # The kv verbs serve the stores: section (see below) — every call names
  # its store. Verbs: get/set/setnx/merge/delete/incr/append/remove/contains/
  # first/last/index/slice/len/pop/list; namespaces isolate keyspaces; values
  # are JSON; ttl: expires a key; read-modify-writes are one backend
  # transaction. Read inline with {{ kv "state" "ns" "key" }} /
  # {{ kvContains "state" "ns" "key" .item }}; code steps get
  # ctx.store("state") (js/lua), store("state") (risor), or
  # import "conductor/store" + store.Use("state") (go-embed). Act once per
  # incident id, durably across runs and restarts:
  # - name: new-incidents
  #   on: [ pd.incident ]
  #   steps:
  #     - { id: gate, uses: kv.get, options: { store: state, namespace: pagerduty, key: last-seen, default: "" } }
  #     - if: "{{ .incident.id }} != {{ .gate.value }}"
  #       uses: slack-ops.post
  #       options: { channel: "#outages", text: "New incident {{ .incident.id }}" }
  #     - { uses: kv.set, options: { store: state, namespace: pagerduty, key: last-seen, value: "{{ .incident.id }}" } }

  # The sql verbs serve the stores: section's SQL types. sql.query returns
  # { rows, count }; sql.exec returns { rows_affected, last_insert_id? }
  # (last_insert_id is absent on postgres — use RETURNING with sql.query).
  # Event data binds through args: to driver placeholders; code steps get
  # ctx.sql("analytics") (js/lua), sql("analytics") (risor), or
  # import "conductor/sql" + sql.Use("analytics") (go-embed). Record each
  # incident as a row:
  # - name: record-incidents
  #   on: [ pd.incident ]
  #   steps:
  #     - uses: sql.exec
  #       options:
  #         store: analytics
  #         sql: "INSERT INTO incidents (id, urgency, title) VALUES ($1, $2, $3)"
  #         args: [ "{{.incident.id}}", "{{.incident.urgency}}", "{{.title}}" ]

  # Review triage through the reusable workflow + a request-response ask.
  - on: gh.review_requested
    filters:
      reviewer: { logins: [your-login] }
      exclude: { branches: ["release/*"], labels: [hold] }
    steps:
      - { id: a, workflow: assess-and-post, with: { repo: "{{.repo}}", pr: "{{.pr}}" } }
      - id: draft
        if: "{{.a.decision}} == auto"
        type: agent
        step: planner
        checkout: none
        prompt: "Draft the review for {{.repo}}#{{.pr}}."
      - id: review
        if: "{{.a.decision}} == auto"
        uses: hoff.ask
        options: { prompt: "Submit this review for {{.repo}}#{{.pr}}?", draft: "{{.draft.text}}", timeout: 2h }
      - id: submit
        if: "{{.review.action}} == approve"
        uses: gh.submit_review
        options: { repo: "{{.repo}}", pr: "{{.pr}}", event: COMMENT, body: "{{.review.text}}" }
    policy:
      quiet_hours: { hold: false } # this workflow ignores the global quiet hours

  # Inline code between services: reshape an alarm, page or post accordingly.
  - on: hooks.cloudwatch
    steps:
      - id: shape
        run: js # QuickJS in-process (wazero); go-embed | go | sh | node | … also work
        code: |
          return { sev: ctx.body.detail.severity || "low",
                   name: ctx.body.detail.alarmName };
      - id: page
        if: "{{.shape.sev}} == high"
        uses: slack-ops.post
        options: { text: "ALARM {{.shape.name}} (high) — {{.url}}" }
      - id: log
        if: "{{.shape.sev}} != high"
        uses: slack-ops.post
        options: { text: "alarm {{.shape.name}} ({{.shape.sev}})" }

  # Scheduled work; a command step's stdout becomes its outputs.
  - on: timer.nightly-tidy
    steps:
      - { id: tidy, type: command, command: [make, tidy], workdir: ~/src/infra }
      # - { id: remote, run: sh, host: build-box, code: "make deploy" }

  # Post release notes to Slack — a cross-boundary one-liner.
  - on: gh.release
    filters: { include_prereleases: false }
    steps:
      - { id: announce, uses: slack-ops.post, options: { text: "released {{.tag_name}}: {{.url}}" } }

# ---------------------------------------------------------------------------
# policy: — cross-cutting controls. This block is valid at three scopes —
# here (global), on a connector, and on a trigger — most specific wins.
# ---------------------------------------------------------------------------
policy:
  quiet_hours: { tz: America/Denver, from: "22:00", to: "07:00", hold: true }
  concurrency: { max_agents: 3, max_agents_per_hour: 40 }
  # guidance: "Write like a busy engineer: a sentence or two, plain and direct."
  #                           # the scoped house-tone baseline (layer 0). Because
  #                           #   policy cascades global -> connector -> trigger,
  #                           #   a connector/trigger `policy.guidance` STACKS on
  #                           #   top; { replace: … } resets the cascade. An agent
  #                           #   profile's own guidance stacks above this. The
  #                           #   legacy top-level `agent_guidance` folds in here.
  #                           #   (wiki: Reuse)
  # max_fan_out: 100          # cap one for_each/parallel step's fan-out (global
  #                             scope; default 100). A for_each over a longer,
  #                             data-driven list is refused, not spawned.
  # pause_label: "conductor:off"
  # shadow: true              # preview everything, dispatch nothing
  # (there is no config kill switch — pause the whole daemon with
  #  `conductor pause` / `resume`; disable one connector or trigger in place
  #  with its own `enabled: false`)

# Conductor's own lifecycle is a built-in source: alerting is an ordinary
# trigger on conductor.* — dispatch, escalate (gave up after retries),
# needs_input, complete, failed (a run errored), updated, update_available.
# Context: {{.message}} (the composed line) + event/ref/repo/number/
# origin_kind/title (the update events add {{.version}}). Routing, per-event
# fan-out (on: lists), quiet hours (policy:), and digests (group: window)
# all come from the normal trigger grammar. The retired notify: block
# auto-migrates to these triggers. A loop guard keeps a lifecycle trigger's
# own run from re-feeding conductor.* (no notify storms);
# escalate/needs_input/complete stay audit-logged for status/report even
# with no trigger configured.
#
# triggers:
#   - name: alert
#     on: [ conductor.escalate, conductor.failed, conductor.needs_input ]
#     steps:
#       - { uses: slack-ops.post, options: { text: "conductor {{.message}}" } }
#   - name: daily-digest
#     on: conductor.complete
#     group: { key: '"digest"', window: 24h }
#     steps:
#       - { uses: slack-ops.post, options: { text: "[digest] {{ len .group.events }} completed run(s) today" } }
#
# conductor also exposes VERBS on itself — uses: conductor.update | pause |
# resume | restart | reload | run {name, inputs}; gh.sweep runs the github
# catch-up now. Gate the self-update as a workflow:
#
# update: { auto: true, apply: workflow }   # detection EMITS conductor.update_available
# triggers:
#   - name: gated-update
#     on: conductor.update_available
#     steps:
#       - { uses: build-box.run, options: { command: "drain.sh" } }
#       - uses: conductor.update              # download + apply + restart
#         hooks:
#           - { at: start, uses: slack-ops.post, options: { text: "updating conductor → {{.version}}" } }
#           - { at: fail,  uses: slack-ops.post, options: { text: "conductor update FAILED: {{.error}}" } }
#       - { uses: build-box.run, options: { command: "smoke-test.sh" } }

update: { auto: true } # self-update (auto-applies by default); auto-migration runs on the new binary's first boot
# update: { auto: true, deps: true } # ALSO keep packs: and `use:` plugins current each cycle (opt-in);
#                                     # a changed dep that still validates restarts to apply; every change is logged
#                                     # with the sha it moved from. Freeze a pack with `hold: true`; freeze a plugin
#                                     # by pinning an exact version (use: <ref>@v1.2.3).
# store:
#   state_file: ~/.local/state/conductor/state.json
#   audit_log:  ~/.local/state/conductor/audit.jsonl
#   history_retention: 14d    # execution-history age bound (#36 §20; default 14d)
#   history_max_runs: 500     # …and count bound (default 500). See `conductor runs`.
# dry_run: false

# ---------------------------------------------------------------------------
# packs: — distributable, reusable config bundles (issue #53). Each entry
# instantiates a versioned pack, namespaced under its instance name. A pack
# ships BEHAVIOR (workflows/agents/policy/checks/disarmed triggers) only; you
# BIND its environment (connectors/secrets/stores). Fetch + lock with
# `conductor init`; preview with `conductor pack plan`. See docs/wiki/Packs.md.
#
# The KEY IS THE REFERENCE: `packs: { pr-review-team: {} }` resolves to the
# official pack repo (github.com/NodeSpy/conductor-packs) with no source: or
# use: line at all. Write `use:` only to point somewhere else:
#
# packs:
#   pr-review-team: {}                            # official, by name
#   house-style: { use: ./packs/house-style }     # a local folder
#   kit:         { use: acme/conductor-packs/kit@^1.2 }   # an explicit repo
#
# The longer form, with everything spelled out:
#
# packs:
#   review:                                       # instance name == the namespace
#     source: github.com/your-org/packs//review-kit@v1.0.0  # @ref PINS — or ./examples/packs/review-kit
#     version: 1.0.0                              # metadata only, NOT a pin — conductor.lock.yaml
#                                                  # records the resolved sha (the real pin)
#     auth:       house/gh-pat                    # OPTIONAL fetch credential for a private source,
#                                                  # resolved through your secrets:/vaults:
#     preset: claude                              # a settings preset (or set `settings:` directly)
#     connectors: { github: gh }                  # BIND the pack's required github -> your connector
#     secrets:    { review_token: house/review }  # BIND a required secret -> your vault ref
#     policy:     { budget: { max_cost_usd: 5 } } # deep-merges onto the pack's bundled policy
#     steps:
#       reviewer: my-opus                         # BIND a role to one of your named steps…
#       handoff:  { workspace: local }            # …or OVERRIDE the bundled one (deep-merge)
#     models:
#       reviewer: claude-opus-5                   # OVERRIDE a bundled fleet
#     on:                                          # its triggers, by qualified name
#       github.pull_request: { filters: { labels_not: [wip] } }
#     # Scope lives on the CONNECTOR, not the pack: each trigger binds to your
#     # connector of its own source type. Two of a type -> disambiguate with
#     # connectors: { github: work-github }; none of a type -> those triggers
#     # go DORMANT with a load notice and the rest of the pack still runs.
#     triggers:
#       on_review_request:                         # the pack ships this DISARMED
#         enabled: true                            # you arm it…
#         repos:   [your-org/app]                  # required for a github trigger — the repo scope IS the consent
#   # Reference an exported pack workflow from your own trigger:
#   #   triggers:
#   #     - on: gh.pull_request
#   #       steps: [ { workflow: review/review-flow } ]

# pack_trust: — OPTIONAL provenance allowlist for pack sources (#53 §21). With
# this set, `conductor init` refuses any REMOTE pack source (at any depth) that
# matches no allow: glob; local sources are exempt; override with
# `conductor init --allow-unlisted`. Absent → no restriction.
#
# pack_trust:
#   allow:
#     - github.com/your-org/*
#     - github.com/acme/conductor-packs*
