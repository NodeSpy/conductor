# conductor — starter config (valid out of the box; does nothing until you enable it).
#
# To go live:
#   1. Create a GitHub App + a smee channel (see README → "GitHub App setup"),
#      or skip the App and set `token: ${GH_PAT}` (webhook + secret, or sweep polling).
#   2. Put the App id + private key path here, and the secrets in conductor.env.
#   3. Set your GitHub login(s) and repo glob(s) below.
#   4. Flip `enabled: true`, run `conductor validate`, then start the service.
#
# Full annotated reference: config.example.yaml (copied next to this file).
#
# The config splits across files by default: every section imports from its
# conf.d/ folder (created empty by the installer) — drop a file in
# conf.d/connectors/ (or runtimes/hosts/agents/workflows/triggers/) and it
# joins that section on the next reload. Inline entries mix in freely.

connectors:
  imports: [conf.d/connectors/*.yaml]
  gh:
    type: github
    enabled: false # <- set true once the App + webhook below are configured
    app:
      app_id: 0 # <- your GitHub App id
      private_key_path: ~/.config/conductor/github-app.pem
      webhook_secret: ${GH_WEBHOOK_SECRET}
      verify_signature: false # keep false with smee; true with a direct `listen` receiver
    webhook:
      smee_url: ${GH_SMEE_URL} # https://smee.io/<channel>   (or use `listen:` for direct HTTP)
    me: { logins: [] } # <- your GitHub login(s), e.g. [octocat] — defines "you"
    repos: ["OWNER/*"] # <- your org/user, e.g. ["octocat/*"] — the default trigger scope

triggers:
  - import: conf.d/triggers/*.yaml
  - on: gh.merge_conflict
    steps:
      - type: agent
        agent: fixer
        prompt: "Resolve the conflict on {{.repo}}#{{.pr}} against {{.base}}, verify it builds, commit, and push."
  - on: gh.failing_checks
    options:
      flaky_rerun: { enabled: true, max: 1 }
    steps:
      - type: agent
        agent: fixer
        prompt: "Fix the failing checks on {{.repo}}#{{.pr}} — diagnose, fix, verify, commit, and push."
  - on: gh.changes_requested
    steps:
      - type: agent
        agent: fixer
        prompt: "Address the requested changes on {{.repo}}#{{.pr}}, commit, push, and reply to threads."

runtimes:
  imports: [conf.d/runtimes/*.yaml]
  paseo: { type: paseo, default: true }

hosts:
  imports: [conf.d/hosts/*.yaml]

workflows:
  imports: [conf.d/workflows/*.yaml]

agents:
  imports: [conf.d/agents/*.yaml]
  fixer:
    provider: claude
    workspace: worktree
    archive_when_done: true

update:
  auto: false # set true to self-update a few times a day
  interval: 8h
